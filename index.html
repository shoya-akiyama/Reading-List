erous and unknown a sea", "as that one", "near the Queensland mainland."]}, {"id": "u33s011", "group": 33, "ja_chunks": ["クックは海域を見つけた", "島が点在する", "浅瀬が"], "en_chunks": ["Cook found the waters", "dotted with islands,", "shoals, and coral banks."]}, {"id": "u33s012", "group": 33, "ja_chunks": ["そして珊瑚礁が / 彼は通って", "曲がりくねった水路と浅瀬を", "神秘的で美しい"], "en_chunks": ["His way was", "through twisting passages and shallows", "of mystery and beauty."]}, {"id": "u33s013", "group": 33, "ja_chunks": ["彼は", "これまでに見たこともないような世界に入りこんだ", "巨大な障壁に気づかなかった", "迫っていた", "航路上に"], "en_chunks": ["He was for a long time", "into a strange world", "unaware of a great barrier", "that was closing in", "upon his track."]}, {"id": "u33s014", "group": 33, "ja_chunks": ["地点で", "現在クックタウンと呼ばれている場所に近い", "珊瑚礁にすっかり取り囲まれてしまった", "彼の船は"], "en_chunks": ["At a spot", "near the present site of Cooktown,", "the coral banks crowded in", "on his ship."]}, {"id": "u33s015", "group": 33, "ja_chunks": ["彼の船は", "座礁し", "この危険な珊瑚礁の1つで"], "en_chunks": ["The ship finally ran", "aground", "on one of the treacherous banks."]}, {"id": "u33s016", "group": 33, "ja_chunks": ["ほとんど身動きが取れなくなった", "手に汗握る話は", "こうした事件や", "見事に救助される", "船と乗組員が", "ハイライトの1つである", "オーストラリアの初期の歴史の"], "en_chunks": ["and was all but lost", "The thrilling story", "of that accident", "and the masterful saving", "of ship and crew", "is one of the highlights", "of Australia's early history."]}, {"id": "u33s017", "group": 33, "ja_chunks": ["世界中のどこにも", "海岸線は存在しない", "保護されている", "手ごわい障壁によって", "オーストラリアの北東の境界ほど", "珊瑚海方面の"], "en_chunks": ["Nowhere in the world", "is there a coastline", "protected by such a formidable barrier", "as", "Australia's north-eastern boundary", "to the Coral Sea."]}, {"id": "u33s018", "group": 33, "ja_chunks": ["私たちの知識は", "この海域に関する", "大いに進歩したが", "発見された当時からは", "ほとんど起こっていない", "表面的な変化は"], "en_chunks": ["While our knowledge", "of the area", "has made great advances", "since the days of discovery,", "little superficial change", "has taken place."]}, {"id": "u33s019", "group": 33, "ja_chunks": ["より古い内陸部と比べて", "オーストラリア本土沿岸への移民は", "今もなお限られており", "性質的に開拓者である"], "en_chunks": ["By comparison with older lands,", "settlement along the mainland", "is still limited and, in many places,", "pioneer in character."]}, {"id": "u33s020", "group": 33, "ja_chunks": ["訪問客にとって", "おきまりの旅行コースから外れる", "いまだに経験することができるのである", "冒険のスリルを", "そして探検の魅力を"], "en_chunks": ["For the visitor", "who leaves the beaten track,", "there is still to be had", "the thrill of adventure", "and the lure of exploration."]}, {"id": "u34s001", "group": 34, "ja_chunks": ["私のおじは英雄でした"], "en_chunks": ["My uncle was a hero."]}, {"id": "u34s002", "group": 34, "ja_chunks": ["すべての男たちと同様", "母方の家族の", "おじは医者でしたが", "後に専門医になりました"], "en_chunks": ["Like all the men", "in my mother's family,", "he was a doctor, first a family doctor", "and later a specialist."]}, {"id": "u34s003", "group": 34, "ja_chunks": ["第2次世界大戦中", "おじはりっぱに職務を果たしましたので", "危険な状況の中で", "そのために勲章をもらいました"], "en_chunks": ["During World War II,", "he acted well", "in a dangerous situation,", "for which he received a medal."]}, {"id": "u34s004", "group": 34, "ja_chunks": ["そのときの話とはこのようなものでした", "おじは", "医師団の1人でした", "従軍"], "en_chunks": ["The story went like this:", "My uncle was", "one of a group of doctors", "following the fighting men."]}, {"id": "u34s005", "group": 34, "ja_chunks": ["誤った情報に従って", "彼らは信じていた", "彼らが向かっている", "丘の上は", "敵が", "一掃されていると"], "en_chunks": ["Acting on false information,", "believing", "they were advancing", "on the hill top", "which", "had been cleared of the enemy."]}, {"id": "u34s006", "group": 34, "ja_chunks": ["丘を登り始めると", "身を潜めていた敵が", "発砲し始めました", "そしてすぐに", "戦場は埋め尽くされてしまいました", "負傷兵や死にそうな兵士で"], "en_chunks": ["As they began to climb the hill,", "the hidden enemy", "began to shoot,", "and within seconds", "the field was covered", "with wounded and dying men."]}, {"id": "u34s007", "group": 34, "ja_chunks": ["敵は続けました", "付近一帯に銃撃を浴びせ"], "en_chunks": ["The enemy continued", "to cover the area with gunfire."]}, {"id": "u34s008", "group": 34, "ja_chunks": ["だれ1人として立ち上がることができないほどでした"], "en_chunks": ["No one could stand up."]}, {"id": "u34s009", "group": 34, "ja_chunks": ["12時間以上たってからのことでした", "飛行機による爆撃で", "敵陣に損害を与えることができたのは"], "en_chunks": ["It was more than twelve hours", "before airplane bombs", "could damage the enemy position."]}, {"id": "u34s010", "group": 34, "ja_chunks": ["腹ばいで前進しながら", "必要なものをくくりつけて", "背中に", "負傷者の手当てをし", "伝言を受け取り", "時には書き留められた / 裏側に", "擦り切れた写真の", "祈りを捧げたりしました", "死に行く兵士とともに", "その間中ずっと"], "en_chunks": ["My uncle, crawling on his stomach", "with supplies tied", "to his back,", "cared for the wounded,", "took messages sometimes written", "on the back", "of worn photographs,", "and said prayers", "with dying men", "during all that time."]}, {"id": "u34s011", "group": 34, "ja_chunks": ["他のアメリカ人兵士がやってきて", "敵が後退を余儀なくされると", "明らかになりました", "彼が救ったことが", "何十人もの兵士の命を"], "en_chunks": ["When other American soldiers came", "and the enemy was forced back,", "it was clear", "that he had saved", "dozens of lives."]}, {"id": "u34s012", "group": 34, "ja_chunks": ["彼は勲章を授与され", "そのときの彼の写真が第1面に掲載されました", "郷里の新聞の"], "en_chunks": ["He was given a medal", "and his picture was on the front page", "of our home town newspaper."]}, {"id": "u34s013", "group": 34, "ja_chunks": ["私は7歳くらいでしたが", "当時 / 本当の英雄とともに", "一族の", "私はすぐにうわさの的になりました", "2年生の"], "en_chunks": ["I was about seven at the time,", "and with a real hero", "in my family,", "I instantly became the talk", "of the second grade."]}, {"id": "u34s014", "group": 34, "ja_chunks": ["ちょうどいいことに", "おじは許可され", "休暇を取ることを", "私たちの元に戻ってくることになりました"], "en_chunks": ["Best of all,", "he was allowed", "to have a rest", "and was coming to visit us."]}, {"id": "u34s015", "group": 34, "ja_chunks": ["私の心は満ちあふれていました", "興奮で"], "en_chunks": ["I was filled", "with excitement."]}, {"id": "u34s016", "group": 34, "ja_chunks": ["心の中では", "私は驚いていました / こうした出来事に"], "en_chunks": ["Secretly, I was surprised", "by these events."]}, {"id": "u34s017", "group": 34, "ja_chunks": ["おじは背が低く、", "はげかかっていて", "メガネをかけていました"], "en_chunks": ["My uncle was short,", "balding,", "and wore glasses."]}, {"id": "u34s018", "group": 34, "ja_chunks": ["彼は少し太ってさえいました"], "en_chunks": ["He was even getting a little fat."]}, {"id": "u34s019", "group": 34, "ja_chunks": ["私は思っていました", "見えるのだろうと", "少しは違って", "英雄になってからは"], "en_chunks": ["I thought", "perhaps", "he would look", "a little different after becoming a hero."]}, {"id": "u34s020", "group": 34, "ja_chunks": ["でも、おじは以前と少しも変わっていませんでした"], "en_chunks": ["But he didn't."]}, {"id": "u34s021", "group": 34, "ja_chunks": ["相も変わらずはにかみやで", "居心地が悪い様子でしたし", "大騒ぎをされて", "落ち着かないようでした", "隣家の人たちが次から次へと", "家にやってきてはおじと握手をしていくので"], "en_chunks": ["Always a shy man,", "he seemed uncomfortable", "with all the fuss", "and uneasy", "as neighbor after neighbor", "came by to shake his hand."]}, {"id": "u34s022", "group": 34, "ja_chunks": ["やっとのことで"], "en_chunks": ["Finally I found my moment."]}, {"id": "u34s023", "group": 34, "ja_chunks": ["私の機会を見つけました / ひざの上によじ登って", "私は告げました", "とても勇敢だと", "おじが", "確信していることを", "おじにはこわいものなんて何もないんじゃないかと"], "en_chunks": ["Climbing into his lap,", "I told him", "how brave", "I thought he was", "and that I was sure", "he was never afraid of anything."]}, {"id": "u34s024", "group": 34, "ja_chunks": ["ほほえみながら", "私に話してくれました", "私の考えが", "事実とまったく違っていること", "これほどこわかったことはなかったことを", "おじの人生で"], "en_chunks": ["Smiling,", "he told me", "that my idea", "was far from true,", "that he had been more frightened", "than ever before in his life."]}, {"id": "u34s025", "group": 34, "ja_chunks": ["ひどくがっかりして", "私はこう言いました", "「でも、それじゃ、どうして", "勲章をもらえたの?」"], "en_chunks": ["Deeply disappointed,", "I said,", "\"But why did they", "give you a medal then?\""]}, {"id": "u34s026", "group": 34, "ja_chunks": ["おじは優しく説明してくれました", "こわがらないような人は", "戦争のような状況で", "馬鹿者である", "勲章は与えられないということを", "愚かな人には"], "en_chunks": ["Gently he explained to me", "that anyone who wasn't afraid", "in situations like war", "was a fool", "and they don't give medals", "to people for being fools."]}, {"id": "u34s027", "group": 34, "ja_chunks": ["おじは言いました", "勇敢であることは", "意味しないと", "こわがらないということを"], "en_chunks": ["He said", "that being brave", "does not mean", "being unafraid."]}, {"id": "u34s028", "group": 34, "ja_chunks": ["勇敢であることはしばしば", "恐怖を感じながらも", "そしてそうであるにもかかわらず行動することなのだと"], "en_chunks": ["It often means", "being afraid", "and doing it anyway."]}, {"id": "u34s029", "group": 34, "ja_chunks": ["このような考え方は初めてのものであり", "いろいろな教訓の中でも", "勇気についての", "私が受け入れてきた", "これまでの人生で", "このことが大きな意味を持ちました", "私には"], "en_chunks": ["It was the first", "of the many teachings", "about courage", "I have received", "in my lifetime", "and it meant a great deal", "to me."]}, {"id": "u34s030", "group": 34, "ja_chunks": ["その頃", "私は暗闇が怖かったのですが / ひどく恥ずかしく思っていました", "このことを"], "en_chunks": ["At the time, I was afraid of the dark", "and deeply ashamed", "about this."]}, {"id": "u34s031", "group": 34, "ja_chunks": ["でも、", "もしもおじでも", "英雄である", "怖かったのだとしたら、もしかすると", "私にも", "希望があるのかもしれません"], "en_chunks": ["But", "if", "my uncle", "was also afraid, then perhaps", "there was hope", "for me as well."]}, {"id": "u34s032", "group": 34, "ja_chunks": ["私は制止され", "恐怖心によって", "暗闇への", "それで決まりの悪い思いをし", "自分を小さな人間のように感じていました", "取るに足りない人間のように"], "en_chunks": ["I had been stopped", "by my fear", "of the dark,", "embarrassed by it,", "and felt small", "and unimportant."]}, {"id": "u34s033", "group": 34, "ja_chunks": ["おじは私に話すことによって", "自分の恐怖心について", "私を解放してくれたのです"], "en_chunks": ["By telling me", "of his fear,", "my uncle had freed me."]}, {"id": "u34s034", "group": 34, "ja_chunks": ["おじの英雄的な行動は、なったのです", "私の人生の物語の一部に", "おじの経歴の一部であるとともに"], "en_chunks": ["His heroism became", "a part of my story", "as well as a part of his."]}, {"id": "u35s001", "group": 35, "ja_chunks": ["英語の隆盛は", "注目すべき成功の物語である"], "en_chunks": ["The rise of English", "is a remarkable success story."]}, {"id": "u35s002", "group": 35, "ja_chunks": ["ジュリアス・シーザーが", "グレート・ブリテン島に上陸したとき", "2000年以上前に", "英語は存在していなかった"], "en_chunks": ["When Julius Caesar", "landed in Britain", "over two thousand years ago,", "English did not exist."]}, {"id": "u35s003", "group": 35, "ja_chunks": ["500年後", "現代人の耳には理解不能で", "おそらく話されていた", "比較的少数の人々に", "ほとんど影響力を持たなかった"], "en_chunks": ["Five hundred years later,", "Old English, incomprehensible to modern ears,", "was probably spoken", "by relatively few people", "with little influence."]}, {"id": "u35s004", "group": 35, "ja_chunks": ["ほぼ1000年後", "16世紀末には", "ウィリアム・シェークスピアが", "全盛期を迎え", "英語は母語になっていた", "500万から", "700万人のイギリス人の"], "en_chunks": ["Nearly a thousand years later,", "at the end of the sixteenth century,", "when William Shakespeare", "was in his prime,", "English was the native speech", "of between five", "and seven million Englishmen."]}, {"id": "u35s005", "group": 35, "ja_chunks": ["400年後", "その対比は驚くべきものである"], "en_chunks": ["Four hundred years later,", "the contrast is extraordinary."]}, {"id": "u35s006", "group": 35, "ja_chunks": ["17世紀から", "現在に至るまでに", "英語を話す人々は", "スコットランド人、アイルランド人、ウェールズ人、アメリカ人、", "その他多くの地域の人々を含んで", "隅々をくまなく旅し", "地球の", "その言語と文化を伝えていった", "彼らと共に"], "en_chunks": ["Between the seventeenth century", "and the present,", "the speakers of English,", "including Scots, Irish, Welsh, American", "and many more,", "traveled into every corner", "of the globe,", "carrying their language and culture", "with them."]}, {"id": "u35s007", "group": 35, "ja_chunks": ["今日、英語は使われている", "少なくとも7億5千万人の人々によって", "このうちのかろうじて半数が", "英語を話しているにすぎない", "母語として"], "en_chunks": ["Today, English is used", "by at least seven hundred and fifty million people,", "and barely half of those", "speak it", "as a mother tongue."]}, {"id": "u35s008", "group": 35, "ja_chunks": ["英語を話す人の人数を評価している見積もりもある", "10億人に近いと"], "en_chunks": ["Some estimates have put that figure", "closer to one billion."]}, {"id": "u35s009", "group": 35, "ja_chunks": ["合計の人数がどうであれ", "英語はこれまでより広範囲に拡散し", "より広く話したり書かれたりしている", "ほかのどの言語よりも"], "en_chunks": ["Whatever the total,", "English is more widely scattered,", "more widely spoken a   const unitSelect = document.getElementById("unitSelect");
  const unitGrid = document.getElementById("unitGrid");
  const home = document.getElementById("home");
  const practice = document.getElementById("practice");
  const homeGrid = document.getElementById("homeGrid");
  const homeTitle = document.getElementById("homeTitle");
  const btnReset = document.getElementById("btnReset");
  const btnBackToUnits = document.getElementById("btnBackToUnits");

  const btnBack = document.getElementById("btnBack");
  const btnStop = document.getElementById("btnStop");
  const practiceTitle = document.getElementById("practiceTitle");
  const practiceSub = document.getElementById("practiceSub");
  const oneCard = document.getElementById("oneCard");
  const navHint = document.getElementById("navHint");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const practiceMain = document.getElementById("practiceMain");

  const MARK_KEY = "shunkan_marks_v2";
  const LAST_KEY = "shunkan_last_v2";

  let selectedUnit = null;
  let activeGroup = null;
  let indexInGroup = 0;

  // --- speech (EN only)
  let voices = [];
  let cachedVoice = null;
  function loadVoices(){
    voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    cachedVoice = pickEnVoice();
  }
  if ("speechSynthesis" in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  function pickEnVoice(){
    // Prefer high-quality Samantha (iOS) or Google US English voices
    var prefs = ["samantha", "google us english", "karen", "daniel", "alex", "english united states"];
    for (var p = 0; p < prefs.length; p++){
      var found = voices.find(function(v){
        return v.name.toLowerCase().indexOf(prefs[p]) !== -1;
      });
      if (found) return found;
    }
    // Fallback: any en-US voice
    var enUS = voices.find(function(v){ return (v.lang || "").toLowerCase() === "en-us"; });
    if (enUS) return enUS;
    // Fallback: any en voice
    return voices.find(function(v){ return (v.lang || "").toLowerCase().startsWith("en"); }) || null;
  }
  function stopSpeak(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); }
  function speakEn(text){
    if (!("speechSynthesis" in window)) return;
    stopSpeak();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.9;
    u.pitch = 1.0;
    if (cachedVoice) u.voice = cachedVoice;
    speechSynthesis.speak(u);
  }

  // --- storage
  function loadMarks(){
    try { return JSON.parse(localStorage.getItem(MARK_KEY) || "{}"); } catch(e){ return {}; }
  }
  function saveMarks(obj){ localStorage.setItem(MARK_KEY, JSON.stringify(obj)); }
  function getMark(sentId){ return loadMarks()[sentId] || ""; }
  function setMark(sentId, mark){
    const m = loadMarks();
    if (mark) m[sentId] = mark;
    else delete m[sentId];
    saveMarks(m);
  }

  function loadLast(){
    try { return JSON.parse(localStorage.getItem(LAST_KEY) || "{}"); } catch(e){ return {}; }
  }
  function saveLast(obj){ localStorage.setItem(LAST_KEY, JSON.stringify(obj)); }
  function setLast(unit, idx){
    const l = loadLast();
    l[String(unit)] = idx;
    saveLast(l);
  }
  function getLast(unit){
    const l = loadLast();
    const v = l[String(unit)];
    return (typeof v === "number" && v >= 0) ? v : 0;
  }

  function unitItems(unitNum){
    return SENTENCES.filter(s => s.group === unitNum);
  }

  // --- UI nav
  var listView = document.getElementById("listView");
  var listMain = document.getElementById("listMain");

  var btnListReset = document.getElementById("btnListReset");
  var btnXOnly = document.getElementById("btnXOnly");
  var btnListView = document.getElementById("btnListView");
  var xOnlyMode = false;
  var xOnlyItems = [];
  var revealedState = {}; // { sentId: [true, false, true, ...] }

  function showScreen(screenEl){
    [unitSelect, home, practice, listView].forEach(s => s.classList.remove("active"));
    screenEl.classList.add("active");
    window.scrollTo({top:0, behavior:"auto"});
  }

  function showUnitSelect(){
    stopSpeak();
    selectedUnit = null;
    activeGroup = null;
    showScreen(unitSelect);
    renderUnitSelect();
  }

  function showHome(unitNum){
    stopSpeak();
    selectedUnit = unitNum;
    activeGroup = null;
    homeTitle.textContent = "Unit " + unitNum + " 目次";
    showScreen(home);
    renderHome();
  }

  function showPractice(sentIndex){
    stopSpeak();
    activeGroup = selectedUnit;
    xOnlyMode = false;
    xOnlyItems = [];
    indexInGroup = sentIndex;
    showScreen(practice);
    practiceTitle.textContent = "Unit " + selectedUnit;
    renderOne();
  }

  function unitCounts(unitNum){
    const items = unitItems(unitNum);
    const marks = loadMarks();
    let good=0, bad=0;
    items.forEach(s => {
      if (marks[s.id] === "\u25CB") good++;
      else if (marks[s.id] === "X") bad++;
    });
    return {total: items.length, good, bad, none: items.length - good - bad};
  }

  function renderUnitSelect(){
    unitGrid.innerHTML = "";
    for (let u = 1; u <= 36; u++){
      const c = unitCounts(u);
      const card = document.createElement("div");
      card.className = "unitCard";
      card.innerHTML =
        '<div class="unitNum">' + u + '</div>' +
        '<div class="unitPills">' +
          '<span class="unitPill good">\u25CB' + c.good + '</span>' +
          '<span class="unitPill bad">X' + c.bad + '</span>' +
        '</div>';
      card.addEventListener("click", (function(unit){ return function(){
        selectedUnit = unit;
        showListView();
      }; })(u));
      unitGrid.appendChild(card);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(m){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[m]; });
  }

  function renderHome(){
    homeGrid.innerHTML = "";
    const items = unitItems(selectedUnit);
    const marks = loadMarks();

    var CHUNK = 5;
    var numGroups = Math.ceil(items.length / CHUNK);

    for (var g = 0; g < numGroups; g++){
      var start = g * CHUNK;
      var end = Math.min(start + CHUNK, items.length);
      var groupItems = items.slice(start, end);

      var good = 0, bad = 0;
      groupItems.forEach(function(s){
        if (marks[s.id] === "\u25CB") good++;
        else if (marks[s.id] === "X") bad++;
      });

      var preview = groupItems[0].ja_chunks.join(" / ");
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="cardTitle">' + (start + 1) + '\u301C' + end + '</div>' +
        '<p class="cardSub">' + escapeHtml(preview) + '</p>' +
        '<div class="pillRow">' +
          '<span class="pill">\u6587 ' + groupItems.length + '</span>' +
          '<span class="pill good">\u25CB ' + good + '</span>' +
          '<span class="pill bad">X ' + bad + '</span>' +
          '<span class="pill">\u672A ' + (groupItems.length - good - bad) + '</span>' +
        '</div>';
      card.addEventListener("click", (function(idx){ return function(){ showPractice(idx); }; })(start));
      homeGrid.appendChild(card);
    }
  }

  function buildJaLine(jaChunks, enP, sentId){
    var frag = document.createDocumentFragment();
    jaChunks.forEach(function(t, i){
      if (i > 0){
        var sl = document.createElement("span");
        sl.className = "slash";
        sl.textContent = "/";
        frag.appendChild(sl);
      }
      var sp = document.createElement("span");
      sp.className = "chunkBtn";
      sp.textContent = t.trim();
      sp.dataset.i = i;
      sp.addEventListener("click", function(e){
        e.stopPropagation();
        toggleChunk(enP, i, sentId);
      });
      frag.appendChild(sp);
    });
    return frag;
  }

  function buildEnLine(enChunks, revealed){
    var frag = document.createDocumentFragment();
    enChunks.forEach(function(t, i){
      if (i > 0){
        var sl = document.createElement("span");
        sl.className = "slash enSlash" + ((revealed && revealed[i]) ? "" : " hidden");
        sl.textContent = "/";
        sl.dataset.i = i;
        frag.appendChild(sl);
      }
      var sp = document.createElement("span");
      sp.className = (revealed && revealed[i]) ? "enChunk" : "enChunk hidden";
      sp.textContent = t.trim();
      sp.dataset.i = i;
      frag.appendChild(sp);
    });
    return frag;
  }

  function toggleChunk(enP, idx, sentId){
    var enSpan = enP.querySelector('.enChunk[data-i="'+idx+'"]');
    if (!enSpan) return;
    var enSlash = enP.querySelector('.enSlash[data-i="'+idx+'"]');
    var wasHidden = enSpan.classList.contains("hidden");
    if (wasHidden){
      enSpan.classList.remove("hidden");
      if (enSlash) enSlash.classList.remove("hidden");
      speakEn(enSpan.textContent.replace(/\s+/g, " ").trim());
    } else {
      enSpan.classList.add("hidden");
      if (enSlash) enSlash.classList.add("hidden");
    }
    if (sentId && revealedState[sentId]){
      revealedState[sentId][idx] = !wasHidden ? false : true;
    }
  }

  function speakFull(enChunks){
    var text = enChunks.join(" ").replace(/\s+/g, " ").trim();
    speakEn(text);
  }

  function setMarkUI(btnGood, btnBad, mark){
    btnGood.classList.toggle("activeGood", mark === "\u25CB");
    btnBad.classList.toggle("activeBad", mark === "X");
  }

  function currentItems(){
    if (xOnlyMode) return xOnlyItems;
    return unitItems(selectedUnit);
  }

  function renderOne(){
    var items = currentItems();
    btnXOnly.classList.toggle("active", xOnlyMode);
    if (items.length === 0){
      oneCard.innerHTML = "<div class='small'>" + (xOnlyMode ? "Xの文がありません。" : "このユニットに文がありません。") + "</div>";
      btnPrev.disabled = true;
      btnNext.disabled = true;
      return;
    }
    indexInGroup = Math.max(0, Math.min(indexInGroup, items.length - 1));
    if (!xOnlyMode) setLast(selectedUnit, indexInGroup);

    var s = items[indexInGroup];
    var mark = getMark(s.id);

    oneCard.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "sent";
    wrap.dataset.sid = s.id;

    var jaP = document.createElement("p");
    jaP.className = "line";
    var enP = document.createElement("p");
    enP.className = "line enLine";

    if (!revealedState[s.id]){
      revealedState[s.id] = s.en_chunks.map(function(){ return false; });
    }
    enP.appendChild(buildEnLine(s.en_chunks, revealedState[s.id]));
    jaP.appendChild(buildJaLine(s.ja_chunks, enP, s.id));

    var meta = document.createElement("div");
    meta.className = "meta";

    var tag = document.createElement("span");
    tag.className = "pill";
    tag.textContent = (xOnlyMode ? "X復習 " : "") + "#" + (indexInGroup + 1) + " / " + items.length;

    var spacer = document.createElement("span");
    spacer.className = "spacer";

    var fullBtn = document.createElement("button");
    fullBtn.className = "fullBtn";
    fullBtn.textContent = "\u5168\u6587\u767a\u97f3";
    fullBtn.addEventListener("click", function(e){
      e.stopPropagation();
      speakFull(s.en_chunks);
    });

    var goodBtn = document.createElement("button");
    goodBtn.className = "markBtn good";
    goodBtn.textContent = "\u25CB";
    var badBtn = document.createElement("button");
    badBtn.className = "markBtn bad";
    badBtn.textContent = "X";

    setMarkUI(goodBtn, badBtn, mark);

    goodBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var cur = getMark(s.id);
      var next = (cur === "\u25CB") ? "" : "\u25CB";
      setMark(s.id, next);
      setMarkUI(goodBtn, badBtn, next);
    });

    badBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var cur = getMark(s.id);
      var next = (cur === "X") ? "" : "X";
      setMark(s.id, next);
      setMarkUI(goodBtn, badBtn, next);
    });

    meta.appendChild(tag);
    meta.appendChild(spacer);
    meta.appendChild(fullBtn);
    meta.appendChild(goodBtn);
    meta.appendChild(badBtn);

    wrap.appendChild(jaP);
    wrap.appendChild(enP);
    wrap.appendChild(meta);

    oneCard.appendChild(wrap);

    btnPrev.disabled = (indexInGroup === 0);
    btnNext.disabled = false;
  }

  function goPrev(){
    if (indexInGroup <= 0) return;
    indexInGroup -= 1;
    stopSpeak();
    renderOne();
    window.scrollTo({top:0, behavior:"auto"});
  }
  function goNext(){
    var items = currentItems();
    if (indexInGroup >= items.length - 1){
      indexInGroup = 0;
    } else {
      indexInGroup += 1;
    }
    stopSpeak();
    renderOne();
    window.scrollTo({top:0, behavior:"auto"});
  }

  // swipe
  var startX = null;
  var startY = null;
  practiceMain.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
  }, {passive:true});

  practiceMain.addEventListener("touchend", function(e){
    if (startX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    startX = null; startY = null;

    if (Math.abs(dy) > Math.abs(dx)) return;
    if (Math.abs(dx) < 55) return;

    if (dx < 0) goNext();
    else goPrev();
  }, {passive:true});

  // events
  btnBackToUnits.addEventListener("click", function(){ showUnitSelect(); });
  btnBack.addEventListener("click", function(){ showUnitSelect(); });
  btnPrev.addEventListener("click", function(){ goPrev(); });
  btnNext.addEventListener("click", function(){ goNext(); });

  btnXOnly.addEventListener("click", function(){
    if (xOnlyMode){
      xOnlyMode = false;
      xOnlyItems = [];
      indexInGroup = getLast(selectedUnit);
    } else {
      var marks = loadMarks();
      xOnlyItems = unitItems(selectedUnit).filter(function(s){ return marks[s.id] === "X"; });
      xOnlyMode = true;
      indexInGroup = 0;
    }
    renderOne();
  });

  btnListView.addEventListener("click", function(){
    showListView();
  });

  btnListBack.addEventListener("click", function(){ showUnitSelect(); });

  function showListView(){
    stopSpeak();
    listTitle.textContent = "Unit " + selectedUnit + " \u4e00\u89a7";
    showScreen(listView);
    listMain.innerHTML = "";
    var hint = document.createElement("p");
    hint.className = "listHint";
    hint.textContent = "\u65e5\u672c\u8a9e\u3092\u30bf\u30c3\u30d7\u3059\u308b\u3068\u3001\u5bfe\u5fdc\u3059\u308b\u82f1\u8a9e\u3092\u8868\u793a\u30fb\u767a\u97f3\u3057\u307e\u3059";
    listMain.appendChild(hint);
    var items = unitItems(selectedUnit);
    items.forEach(function(s, i){
      var div = document.createElement("div");
      div.className = "listItem";

      var jaP = document.createElement("p");
      jaP.className = "listJa";
      var enP = document.createElement("p");
      enP.className = "listEn";
      if (!revealedState[s.id]){
        revealedState[s.id] = s.en_chunks.map(function(){ return false; });
      }
      enP.appendChild(buildEnLine(s.en_chunks, revealedState[s.id]));
      jaP.appendChild(buildJaLine(s.ja_chunks, enP, s.id));

      var meta = document.createElement("div");
      meta.className = "listMeta";
      var number = document.createElement("span");
      number.textContent = "#" + (i + 1);
      var spacer = document.createElement("span");
      spacer.className = "spacer";
      var goodBtn = document.createElement("button");
      goodBtn.className = "listMarkBtn good";
      goodBtn.textContent = "\u25CB";
      goodBtn.setAttribute("aria-label", "\u6b63\u89e3\u3068\u3057\u3066\u30c1\u30a7\u30c3\u30af");
      var badBtn = document.createElement("button");
      badBtn.className = "listMarkBtn bad";
      badBtn.textContent = "X";
      badBtn.setAttribute("aria-label", "\u8981\u5fa9\u7fd2\u3068\u3057\u3066\u30c1\u30a7\u30c3\u30af");
      setMarkUI(goodBtn, badBtn, getMark(s.id));

      goodBtn.addEventListener("click", function(){
        var cur = getMark(s.id);
        var next = cur === "\u25CB" ? "" : "\u25CB";
        setMark(s.id, next);
        setMarkUI(goodBtn, badBtn, next);
      });
      badBtn.addEventListener("click", function(){
        var cur = getMark(s.id);
        var next = cur === "X" ? "" : "X";
        setMark(s.id, next);
        setMarkUI(goodBtn, badBtn, next);
      });

      meta.appendChild(number);
      meta.appendChild(spacer);
      meta.appendChild(goodBtn);
      meta.appendChild(badBtn);
      div.appendChild(jaP);
      div.appendChild(enP);
      div.appendChild(meta);
      listMain.appendChild(div);
    });
  }


  function resetSelectedUnit(){
    var ok = confirm("\u3053\u306e\u30e6\u30cb\u30c3\u30c8\u306e\u25cb/X\u8a18\u9332\u3092\u6d88\u3057\u307e\u3059\u304b\uff1f");
    if (!ok) return;
    var items = unitItems(selectedUnit);
    var m = loadMarks();
    items.forEach(function(s){
      delete m[s.id];
      delete revealedState[s.id];
    });
    saveMarks(m);
    stopSpeak();
    if (listView.classList.contains("active")) showListView();
    else renderHome();
    alert("\u30ea\u30bb\u30c3\u30c8\u3057\u307e\u3057\u305f\u3002");
  }

  btnReset.addEventListener("click", resetSelectedUnit);
  btnListReset.addEventListener("click", resetSelectedUnit);

  // init
  renderUnitSelect();
</script>
</body>
</html>
