<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>瞬間英作文 v8（保存＋スワイプ）</title>
  <style>
    :root{
      --bg:#0b0c10;--card:#12141b;--text:#e9ecf1;--sub:#a9b0bf;--line:#232735;
      --accent:#6ea8fe;--good:#3ddc84;--bad:#ff6b6b;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    }
    .screen{display:none; min-height:100vh;}
    .screen.active{display:block;}
    header{
      position:sticky; top:0; z-index:10;
      background:rgba(11,12,16,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
      padding:14px 14px 10px;
    }
    .topbar{
      display:grid;
      grid-template-columns:88px 1fr 88px;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .title{font-size:16px;font-weight:900;margin:0;text-align:center;}
    button{
      width:100%;
      appearance:none;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-size:14px;
    }
    button:active{transform:translateY(1px);}
    .ghost{opacity:0;pointer-events:none;}
    main{padding:12px 12px 24px; max-width:980px; margin:0 auto;}
    .small{font-size:12px;color:var(--sub);line-height:1.45;}

    /* Unit select grid */
    .unitGrid{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;}
    @media(max-width:480px){.unitGrid{grid-template-columns:repeat(3, 1fr);}}
    .unitCard{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:14px;
      padding:14px 10px;
      text-align:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:border-color .15s;
    }
    .unitCard:active{transform:translateY(1px);}
    .unitCard:hover{border-color:var(--accent);}
    .unitNum{font-size:22px;font-weight:900;margin:0 0 4px;}
.unitPills{margin-top:8px; display:flex; gap:4px; justify-content:center; flex-wrap:wrap; font-size:13px;}
    .unitPill{border:1px solid var(--line); padding:3px 8px; border-radius:999px;}
    .unitPill.good{color:var(--good);}
    .unitPill.bad{color:var(--bad);}

    /* Home cards */
    .grid{display:grid; grid-template-columns:1fr; gap:12px;}
    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:16px;
      padding:14px;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .cardTitle{font-size:18px;font-weight:900;margin:0 0 6px;}
    .cardSub{font-size:12px;color:var(--sub);margin:0;line-height:1.45;}
    .pillRow{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; color:var(--sub); font-size:12px;}
    .pill{border:1px solid var(--line); padding:4px 10px; border-radius:999px;}
    .pill.good{color:var(--good);}
    .pill.bad{color:var(--bad);}

    /* Practice */
    .practiceWrap{padding-bottom:90px;}
    .sent{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:16px;
      padding:14px 14px 12px;
      margin:12px 0;
      -webkit-tap-highlight-color:transparent;
    }
    .line{
      margin:0;
      font-size:18px;
      line-height:1.7;
      letter-spacing:.2px;
      white-space:pre-wrap;
      user-select:none;
    }
    .enLine{
      margin-top:10px;
      font-size:20px;
      line-height:1.65;
      color:var(--accent);
    }
    .slash{color:var(--sub);padding:0 6px;}
    .chunkBtn{cursor:pointer;padding:2px 4px;border-radius:8px;}
    .chunkBtn:active{opacity:.85;}
    .enChunk{
      display:inline-block;
      border-radius:8px;
      padding:2px 4px;
      background:rgba(110,168,254,.10);
    }
    .enChunk.hidden{visibility:hidden;}
    .enSlash.hidden{visibility:hidden;}
    .meta{
      margin-top:12px;
      font-size:12px;
      color:var(--sub);
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .meta .spacer{flex:1;}
    .fullBtn{font-size:12px; padding:6px 10px;}
    .markBtn{
      font-weight:900;
      padding:6px 10px;
      border-radius:999px;
      width:auto;
    }
    .markBtn.good{border-color:rgba(61,220,132,.55);}
    .markBtn.bad{border-color:rgba(255,107,107,.55);}
    .markBtn.activeGood{background:rgba(61,220,132,.2);}
    .markBtn.activeBad{background:rgba(255,107,107,.2);}

    .footerBar{
      position:fixed; left:0; right:0; bottom:0;
      background:rgba(11,12,16,.92);
      backdrop-filter:blur(10px);
      border-top:1px solid var(--line);
      padding:10px 12px;
      z-index:20;
    }
    .footerGrid{
      max-width:980px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .hint{
      max-width:980px;
      margin:6px auto 0;
      font-size:11px;
      color:var(--sub);
      line-height:1.4;
      padding:0 2px;
    }
    .footerGrid3{
      max-width:980px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr 1fr 1fr 1fr;
      gap:8px;
    }
    .footerGrid3 button{font-size:13px;padding:10px 6px;}
    .modeBtn.active{border-color:var(--accent);color:var(--accent);}
    /* List view */
    .listWrap{padding-bottom:24px;}
    .listItem{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:12px;
      padding:12px;
      margin:8px 0;
    }
    .listJa{font-size:17px;line-height:1.7;margin:0;}
    .listEn{font-size:17px;line-height:1.7;color:var(--accent);margin:7px 0 0;min-height:1.7em;}
    .listHint{text-align:center;margin:0 0 12px;color:var(--sub);font-size:12px;}
    .listMeta{
      margin-top:9px;
      display:flex;
      gap:8px;
      align-items:center;
      color:var(--sub);
      font-size:12px;
    }
    .listMeta .spacer{flex:1;}
    .listMarkBtn{font-size:13px;padding:5px 12px;width:auto;border-radius:999px;font-weight:900;}
    .listMarkBtn.good{border-color:rgba(61,220,132,.55);}
    .listMarkBtn.bad{border-color:rgba(255,107,107,.55);}
    .listMarkBtn.activeGood{background:rgba(61,220,132,.2);color:var(--good);}
    .listMarkBtn.activeBad{background:rgba(255,107,107,.2);color:var(--bad);}
  </style>
</head>
<body>

  <!-- UNIT SELECT -->
  <section class="screen active" id="unitSelect">
    <header>
      <div class="topbar">
        <button class="ghost">戻る</button>
        <h1 class="title">ユニット選択</h1>
        <button class="ghost">　</button>
      </div>
    </header>
    <main>
      <div class="unitGrid" id="unitGrid"></div>
    </main>
  </section>

  <!-- HOME (sentences list for selected unit) -->
  <section class="screen" id="home">
    <header>
      <div class="topbar">
        <button id="btnBackToUnits">戻る</button>
        <h1 class="title" id="homeTitle">目次</h1>
        <button id="btnReset">リセット</button>
      </div>
      <div class="small">
        1文＝1カード（ピリオドまで）。<br>
        <b>日本語チャンクをタップ → 対応英語チャンクだけ表示＆英語だけ発音</b>。<br>
        〇/Xは保存されます。学習画面は<b>左右スワイプで前後の文</b>へ。
      </div>
    </header>
    <main>
      <div class="grid" id="homeGrid"></div>
    </main>
  </section>

  <!-- LIST VIEW -->
  <section class="screen" id="listView">
    <header>
      <div class="topbar">
        <button id="btnListBack">戻る</button>
        <h1 class="title" id="listTitle">一覧</h1>
        <button id="btnListReset">リセット</button>
      </div>
    </header>
    <main class="listWrap" id="listMain"></main>
  </section>

  <!-- PRACTICE -->
  <section class="screen" id="practice">
    <header>
      <div class="topbar">
        <button id="btnBack">戻る</button>
        <h1 class="title" id="practiceTitle">学習</h1>
        <button class="ghost">　</button>
      </div>
    </header>

    <main class="practiceWrap" id="practiceMain">
      <div id="oneCard"></div>
    </main>

    <div class="footerBar">
      <div class="footerGrid3">
        <button id="btnPrev">◀ 前</button>
        <button id="btnNext">次 ▶</button>
        <button id="btnXOnly" class="modeBtn">X復習</button>
        <button id="btnListView" class="modeBtn">一覧</button>
      </div>
    </div>
  </section>

<script>
  const SENTENCES = [{"id": "u01s001", "group": 1, "ja_chunks": ["英語は言語である", "使用されている", "多くの人々によって", "世界中で"], "en_chunks": ["English is a language", "which is used", "by a lot of people", "all over the world."]}, {"id": "u01s002", "group": 1, "ja_chunks": ["それは話されている", "イギリスで", "カナダで", "アメリカ合衆国で", "オーストラリアで", "そしてニュージーランドで"], "en_chunks": ["It is spoken", "in England,", "in Canada,", "in the U.S.A.,", "Australia,", "and in New Zealand."]}, {"id": "u01s003", "group": 1, "ja_chunks": ["それはまた話されている", "世界のその他の地域で"], "en_chunks": ["It is also spoken", "in other parts of the world."]}, {"id": "u01s004", "group": 1, "ja_chunks": ["中国語だけが", "話されている", "より多くの人々によって"], "en_chunks": ["Only Chinese", "is spoken", "by more people."]}, {"id": "u01s005", "group": 1, "ja_chunks": ["いくつかの国では", "多くの異なる言語が", "話されている"], "en_chunks": ["In some countries", "many different languages", "are spoken."]}, {"id": "u01s006", "group": 1, "ja_chunks": ["ある国では", "人々は持つ", "10以上の言語を"], "en_chunks": ["In one country", "people have", "over ten languages."]}, {"id": "u01s007", "group": 1, "ja_chunks": ["彼らは話す", "1つの言語を", "その国のある地方で", "そしてその国の別の地方では", "彼らは別の言語を話す"], "en_chunks": ["They speak", "one language", "in one part of the country,", "and in another part of the country", "they speak another."]}, {"id": "u01s008", "group": 1, "ja_chunks": ["2人の人が", "その国の異なる地方出身の", "会ったとき", "彼らは理解できない", "お互いを"], "en_chunks": ["When two people", "from different parts of the country", "meet,", "they cannot understand", "each other."]}, {"id": "u01s009", "group": 1, "ja_chunks": ["彼らは知らない", "その言語の両方を"], "en_chunks": ["They don't know", "both of the languages."]}, {"id": "u01s010", "group": 1, "ja_chunks": ["人々はどのようにして", "異なる母語を持つ", "お互いを理解できるのだろうか"], "en_chunks": ["How can people", "with different native languages", "understand each other?"]}, {"id": "u01s011", "group": 1, "ja_chunks": ["そのような場合", "英語が使われる"], "en_chunks": ["In such a case", "English is used."]}, {"id": "u01s012", "group": 1, "ja_chunks": ["別の国では", "人々は買う", "ある国々から", "そして売る", "別の国々へ", "そこで、彼らは信じている", "重要であると", "彼らにとって", "英語を学ぶことは"], "en_chunks": ["In another country", "people buy", "from some countries", "and sell", "to other countries,", "so they believe", "it is important", "for them", "to learn English."]}, {"id": "u01s013", "group": 1, "ja_chunks": ["生徒は学ばなければならない", "2つの言語を", "英語と母語という", "そして多くの学校で", "ほとんどすべての授業が", "英語で行われる"], "en_chunks": ["Students must learn", "two languages,", "English and their own language,", "and in a lot of schools", "almost all the lessons", "are given in English."]}, {"id": "u01s014", "group": 1, "ja_chunks": ["科学者たちはよく会合する", "物事について話すために", "彼らが研究している"], "en_chunks": ["Scientists often meet", "to talk about things", "they are studying."]}, {"id": "u01s015", "group": 1, "ja_chunks": ["彼らはやってくる", "異なる国から"], "en_chunks": ["They come", "from different countries."]}, {"id": "u01s016", "group": 1, "ja_chunks": ["しかし彼らのほとんどは", "読み書きができる", "英語で", "それで英語は本当によく使われる", "共通語として"], "en_chunks": ["But most of them", "can read and write", "in English,", "so English is very often used", "as a common language."]}, {"id": "u01s017", "group": 1, "ja_chunks": ["英語は今では", "言語である", "世界のたくさんの人々の"], "en_chunks": ["English is now", "the language", "of many of the world's people."]}, {"id": "u01s018", "group": 1, "ja_chunks": ["様々な方法がある", "英語を話したり発音したりする", "英語", "世界の様々な場所で"], "en_chunks": ["There are different ways", "of speaking and pronouncing", "English", "in different parts of the world."]}, {"id": "u01s019", "group": 1, "ja_chunks": ["時々", "アメリカ人でさえ", "理解できない", "イギリス人を"], "en_chunks": ["Sometimes", "even Americans", "cannot understand", "British people."]}, {"id": "u01s020", "group": 1, "ja_chunks": ["英語は異なる", "場所によって", "そして変化する", "少しずつ"], "en_chunks": ["English is different", "from place to place", "and changes", "little by little."]}, {"id": "u01s021", "group": 1, "ja_chunks": ["もしあなたが考えるなら", "母語について", "このことが理解できるだろう"], "en_chunks": ["If you think", "about your own language,", "you can understand this."]}, {"id": "u02s001", "group": 2, "ja_chunks": ["合衆国には", "多くの有名な大統領がいた"], "en_chunks": ["The United States", "had many famous Presidents."]}, {"id": "u02s002", "group": 2, "ja_chunks": ["外国の人々は", "名前を知っている", "ワシントン、リンカーン", "そしてケネディ"], "en_chunks": ["People from other countries", "know the names", "Washington, Lincoln,", "and Kennedy."]}, {"id": "u02s003", "group": 2, "ja_chunks": ["しかし多くの大統領がいる", "あまりよく知られていない", "他の場所では"], "en_chunks": ["But there are many Presidents", "who are not well-known", "in other parts of the world."]}, {"id": "u02s004", "group": 2, "ja_chunks": ["以下は", "彼らのうちの何人かだ"], "en_chunks": ["Here are", "some of them."]}, {"id": "u02s005", "group": 2, "ja_chunks": ["ジョン・アダムズは", "2代目の大統領だった", "ジョージ・ワシントンの後の"], "en_chunks": ["John Adams", "was the second President", "after George Washington."]}, {"id": "u02s006", "group": 2, "ja_chunks": ["彼は信じていた", "人々だけが", "「家柄のよい」", "リーダーになることができると"], "en_chunks": ["He believed", "that only people", "who were \"well-born\"", "could be leaders."]}, {"id": "u02s007", "group": 2, "ja_chunks": ["彼は考えた", "リーダーは持っていなければならないと", "たくさんのお金を", "そしてよい教育を"], "en_chunks": ["He thought", "that leaders had to have", "a lot of money", "and a good education."]}, {"id": "u02s008", "group": 2, "ja_chunks": ["しかし多くの人々がいた", "そう思わない"], "en_chunks": ["But there were many people", "who did not think so."]}, {"id": "u02s009", "group": 2, "ja_chunks": ["そして彼らは考え始めた", "リーダーは出るべきであると", "「民衆」から", "「民衆」から"], "en_chunks": ["And they began to think", "that a leader", "should come", "from \"the people.\""]}, {"id": "u02s010", "group": 2, "ja_chunks": ["アダムズは最初の大統領だった", "ホワイトハウスで生活した"], "en_chunks": ["Adams was the first President", "to live in the White House."]}, {"id": "u02s011", "group": 2, "ja_chunks": ["それはまだ完成していなかった", "それで大統領と彼の妻は", "洗濯物をかけなければならなかった", "イースト・ルームに"], "en_chunks": ["It wasn't finished,", "so the President and his wife", "had to hang their laundry", "in the East Room."]}, {"id": "u02s012", "group": 2, "ja_chunks": ["今日", "大統領は重要なパー  {"id": "u03s026", "group": 3, "ja_chunks": ["化学物質もまた原因となる", "土壌や水質汚染の"], "en_chunks": ["Chemicals also cause", "land and water pollution."]}, {"id": "u03s027", "group": 3, "ja_chunks": ["工場は使用する", "多くの化学物質を", "土壌に入り込む", "そして水に", "近くの"], "en_chunks": ["Factories use", "many chemicals", "that go into the land", "and water", "nearby."]}, {"id": "u03s028", "group": 3, "ja_chunks": ["多くの異なる化学物質が", "水を汚染する", "それで人々は"], "en_chunks": ["Many different chemicals", "pollute the water,", "so people cannot use it."]}, {"id": "u03s029", "group": 3, "ja_chunks": ["水が使えない / 汚染された水は", "多くの植物を枯らす", "そして動物も"], "en_chunks": ["The polluted water", "kills many plants", "and animals."]}, {"id": "u03s030", "group": 3, "ja_chunks": ["地球上の生命は", "環境に依存している"], "en_chunks": ["Life on earth", "depends on the environment."]}, {"id": "u03s031", "group": 3, "ja_chunks": ["十分な酸素がなければならない", "大気中には"], "en_chunks": ["There must be enough oxygen", "in the air."]}, {"id": "u03s032", "group": 3, "ja_chunks": ["きれいな水がなければならない", "そして十分な食料が"], "en_chunks": ["There must be clean water", "and enough food."]}, {"id": "u03s033", "group": 3, "ja_chunks": ["人間は", "植物や動物だけでなく", "これらのものが必要である", "生き残るために"], "en_chunks": ["Human beings,", "as well as plants and animals,", "need these things", "to survive."]}, {"id": "u04s001", "group": 4, "ja_chunks": ["私は初めて聞いた", "マザー・テレサについて", "高校時代に"], "en_chunks": ["I first heard", "about Mother Teresa", "in high school."]}, {"id": "u04s002", "group": 4, "ja_chunks": ["私たちはビデオを見た", "彼女の仕事についての", "インドで", "そして世界中での"], "en_chunks": ["We watched a video", "about her work", "in India", "and all over the world."]}, {"id": "u04s003", "group": 4, "ja_chunks": ["あなたは知っていましたか", "彼女が生まれたことを", "ユーゴスラビアと呼ばれている国で", "ヨーロッパの"], "en_chunks": ["Did you know", "that she was born", "in a country called Yugoslavia", "in Europe?"]}, {"id": "u04s004", "group": 4, "ja_chunks": ["教えた後", "女子校で", "16年間", "カルカッタで", "ある日", "神が彼女に話しかけた"], "en_chunks": ["After teaching", "at a girls' school", "for 16 years", "in Calcutta,", "one day", "God spoke to her."]}, {"id": "u04s005", "group": 4, "ja_chunks": ["神は彼女に言った", "世界で最も貧しい人々に仕えるようにと"], "en_chunks": ["God told her", "to serve the poorest people in the world."]}, {"id": "u04s006", "group": 4, "ja_chunks": ["その日から", "彼女は働いた", "とても熱心に / 貧しい人々の手助けをするために"], "en_chunks": ["After that day,", "she worked very hard", "to help poor people."]}, {"id": "u04s007", "group": 4, "ja_chunks": ["私はとても心を動かされた", "彼女の親切な心に", "他人を助けようとする", "そして無限の愛", "すべての人に対する", "なので私もまたやってみたかった", "そのような仕事を", "彼女がしてきた"], "en_chunks": ["I was so moved", "by her kind heart", "to help others", "and endless love", "for every person,", "that I, too, wanted to try", "the kind of work", "that she was doing."]}, {"id": "u04s008", "group": 4, "ja_chunks": ["それで2人の友だちと一緒に", "カルカッタへ飛行機で行った"], "en_chunks": ["So with two friends", "I flew to Calcutta."]}, {"id": "u04s009", "group": 4, "ja_chunks": ["私は頼まれた", "病気の人のための家で働くようにと", "持っていない", "病院に払うだけの十分なお金を"], "en_chunks": ["I was asked", "to work in a home for sick people", "who did not have", "enough money to pay for a hospital."]}, {"id": "u04s010", "group": 4, "ja_chunks": ["しかし1つ問題があった", "ボランティアは出入りする", "とても頻繁に", "そのため彼らは実際には学べない", "ある特定の仕事を", "また親しい友人にはなれない", "その人々とは"], "en_chunks": ["But there was one problem:", "volunteers come and go", "so often", "that they can't really learn", "a certain job", "or become close friends", "with the people."]}, {"id": "u04s011", "group": 4, "ja_chunks": ["ある人々はやって来る", "1週間", "他の人たちは", "6か月間ほど"], "en_chunks": ["Some people come", "for a week,", "others", "for about six months."]}, {"id": "u04s012", "group": 4, "ja_chunks": ["それでカトリック教会のシスターたちは", "私たちに言おうとしなかった", "何をしたらいいかを"], "en_chunks": ["So the Catholic sisters", "would not tell us", "what to do."]}, {"id": "u04s013", "group": 4, "ja_chunks": ["私たちは仕事を見つけなければならなかった", "やるべき", "自分で"], "en_chunks": ["We had to find work", "to do", "by ourselves."]}, {"id": "u04s014", "group": 4, "ja_chunks": ["私は手伝った", "衣服やシーツを洗うのを", "昼食を出し", "そして人々に食べさ ": ["They think", "telling the truth is not polite", "when it hurts someone."]}, {"id": "u09s027", "group": 9, "ja_chunks": ["私たちはこの考えを見つけることができる", "西洋社会においても", "しかし多くはない", "日本におけるほど"], "en_chunks": ["We can find this idea", "in Western culture, too,", "but not as much", "as in Japan."]}, {"id": "u09s028", "group": 9, "ja_chunks": ["日本の表現がある", "「ふたをするべきだ", "なべに", "くさいにおいがする」"], "en_chunks": ["There is a Japanese expression,", "'You should put a lid", "on a pot", "that smells bad.'"]}, {"id": "u09s029", "group": 9, "ja_chunks": ["これは示すために使われたものだ", "言うべきではないと", "物事について真実を", "誰かを傷つけるような"], "en_chunks": ["This is used to show", "that we should not tell", "the truth about things", "that may hurt someone."]}, {"id": "u09s030", "group": 9, "ja_chunks": ["このようにして", "あなたは時には言わなければならない", "嘘を"], "en_chunks": ["In this way,", "you sometimes have to tell", "a lie."]}, {"id": "u09s031", "group": 9, "ja_chunks": ["日本社会では", "人々は暮らせない", "仲良く", "もしみんなが言うなら", "すべてのことについて真実を"], "en_chunks": ["In Japanese society,", "people cannot live", "in harmony", "if everyone tells", "the truth about everything."]}, {"id": "u09s032", "group": 9, "ja_chunks": ["嘘をつくことは", "平穏を守るために", "自然である", "そしてほとんどの人々は感じている", "それはまた別の一部分であると", "日本社会の"], "en_chunks": ["Lying", "to keep the peace", "is natural", "and most people feel", "that it is another part", "of Japanese society."]}, {"id": "u10s001", "group": 10, "ja_chunks": ["今日", "テレビがある", "ほとんどすべての家に"], "en_chunks": ["Today", "there is a television set", "in almost every house."]}, {"id": "u10s002", "group": 10, "ja_chunks": ["いくつかの国では", "あなたは選ぶことができる", "約40の異なるチャンネルから", "あるものは見せる", "たった1つの種類を", "番組の", "例えばニュース、スポーツ", "音楽", "演劇あるいは映画", "大部分は見せる", "様々な種類の番組を", "そして視聴者に与えている", "広い範囲の娯楽を", "それから選ぶような"], "en_chunks": ["In some countries,", "you can choose", "from about forty different channels;", "some show", "only a single type", "of program", "news, sports,", "music,", "theater or movies;", "most show", "different kinds of programs", "and give the viewer", "a lk about / at school;", "they no longer could talk", "about their favorite comedians,", "singers,", "or actors."]}, {"id": "u11s023", "group": 11, "ja_chunks": ["何人かの母親は気づいた", "話すことがより少なくなったことに", "幼い子どもたちと"], "en_chunks": ["Several mothers found", "they had less to talk about", "with their young children."]}, {"id": "u11s024", "group": 11, "ja_chunks": ["終わりに", "その実験の", "家族の大部分が", "テレビを戻すように望んだ", "彼らの家庭に"], "en_chunks": ["At the end", "of the experiment,", "most of the families", "wanted to have the television back", "in their homes."]}, {"id": "u11s025", "group": 11, "ja_chunks": ["しかしながら", "彼らは言った", "将来は", "見るつもりだ", "特定の番組だけ", "そして生活を許さない", "コントロールされることを", "テレビに"], "en_chunks": ["However,", "they said", "that in the future", "they would watch", "only certain programs,", "and not allow their lives", "to be controlled", "by television."]}, {"id": "u12s001", "group": 12, "ja_chunks": ["「老婦人が", "5人の少年たちに襲われた」"], "en_chunks": ["\"An old woman", "was attacked by five boys!\""]}, {"id": "u12s002", "group": 12, "ja_chunks": ["と新聞に書いてある"], "en_chunks": ["says a newspaper."]}, {"id": "u12s003", "group": 12, "ja_chunks": ["「郵便配達員が発見した", "80歳の男性が", "1人で住んでいる", "亡くなっているのを」", "とニュース・キャスターは読む", "テレビで"], "en_chunks": ["\"The postman found", "an eighty-year-old man", "living alone", "dead,\"", "reads the newsman", "on TV."]}, {"id": "u12s004", "group": 12, "ja_chunks": ["これらのような話は", "私たちにもたらす", "悲しくてぞっとするようなイメージを", "高齢者の"], "en_chunks": ["Stories like these", "give us", "a sad, frightening picture", "of old people."]}, {"id": "u12s005", "group": 12, "ja_chunks": ["私たちは聞いたり読んだりする", "孤独な高齢者たちについて", "貧しい高齢者たち", "病気だったり身よりのない高齢者たち"], "en_chunks": ["We hear and read", "about the lonely ones,", "the poor,", "sick and helpless ones."]}, {"id": "u12s006", "group": 12, "ja_chunks": ["このことはすべて意味するのだろうか", "若者は何もかも持っていることを", "高齢者は何も持っていないという一方で"], "en_chunks": ["Does this all mean", "that youth has everything,", "while old age has nothing?"]}, {"id": "u12s007", "group": 12, "ja_chunks": ["確かに", "時代は変化している", "高齢者にとって"], "en_chunks": ["Certainly,", "times are changing", "for the old."]}, {"id": "u12s008", "group": 12, "ja_chunks": ["しかし必ずしもすべての変化が", "悪いというわけではない"], "en_chunks": ["But not all the changes", "are bad ones."]}, {"id": "u12s009", "group": 12, "ja_chunks": ["現代医学は", "例えば", "高齢者をより健康にした", "かつてないほど"], "en_chunks": ["Modern medicine,", "for example,", "has made old people healthier", "than ever before."]}, {"id": "u12s010", "group": 12, "ja_chunks": ["多くの人々が今では自分のことは自分でできる", "80歳まで", "あるいは90歳までも"], "en_chunks": ["Many can now look after themselves", "until they are eighty", "or even ninety years old."]}, {"id": "u12s011", "group": 12, "ja_chunks": ["その上", "いる", "ずっと多くの高齢者が", "以前よりも"], "en_chunks": ["Besides,", "there are", "many more old people", "than there used to be."]}, {"id": "u12s012", "group": 12, "ja_chunks": ["平均的なイギリス人女性は生きる", "75歳まで"], "en_chunks": ["The average British woman lives", "till she is seventy-five."]}, {"id": "u12s013", "group": 12, "ja_chunks": ["平均的なイギリス人男性は生きる", "70歳まで"], "en_chunks": ["The average British man lives", "till he is seventy."]}, {"id": "u12s014", "group": 12, "ja_chunks": ["このことは意味する", "高齢者はしばしば持つということを", "よい社会生活を", "人々との", "同世代の"], "en_chunks": ["This means", "that old people often have", "a good social life", "with the people", "of their own generation."]}, {"id": "u12s015", "group": 12, "ja_chunks": ["高齢者はまた、もっと金を持っている", "今", "彼らの両親より", "そして祖父母が持っていたよりも"], "en_chunks": ["Old people, too, have more money", "now", "than their own parents", "and grandparents had."]}, {"id": "u12s016", "group": 12, "ja_chunks": ["「老齢年金」は", "少ない", "しかしその援助で", "高齢者は今、得ている", "十分な食料を", "食べるための", "そして衣服を", "着るための"], "en_chunks": ["The \"old age pension\"", "is small,", "but with its help,", "old people now have", "enough food", "to eat", "and clothes", "to wear."]}, {"id": "u12s017", "group": 12, "ja_chunks": ["最大の問題は", "現代生活の", "孤独である"], "en_chunks": ["The greatest problem", "of modern life", "is loneliness."]}, {"id": "u12s018", "group": 12, "ja_chunks": ["子どもたちは家を出る", "成長すると", "そして多くの高齢者が", "1人で住んでいる"], "en_chunks": ["Children leave home", "when they grow up", "and many old people", "live alone."]}, {"id": "u12s019", "group": 12, "ja_chunks": ["家族はより小さくなっている", "近頃"], "en_chunks": ["Families are smaller", "these days."]}, {"id": "u12s020", "group": 12, "ja_chunks": ["少数しかいない (高齢者は)", "兄弟姉妹を持っている"], "en_chunks": ["Fewer old people", "have brothers and sisters."]}, {"id": "u12s021", "group": 12, "ja_chunks": ["おそらく", "高齢者の", "1人あるいは2人の子どもが", "引っ越した", "別の場所へ", "その国の"], "en_chunks": ["Perhaps,", "an old person's", "one or two children", "have moved", "to another part", "of the country."]}, {"id": "u12s022", "group": 12, "ja_chunks": ["彼らが住んでいるときでさえ", "近くに", "彼らには自分の仕事がある", "するべき", "そして彼ら自身の子どもがいる", "世話をするべき"], "en_chunks": ["Even when they live", "nearby,", "they have their own work", "to do,", "and their own children", "to look after."]}, {"id": "u12s023", "group": 12, "ja_chunks": ["彼らには十分な時間がない", "親のための"], "en_chunks": ["They don't have much time", "for their parents."]}, {"id": "u12s024", "group": 12, "ja_chunks": ["孤独の問題は", "しばしば始まる", "人が仕事をやめたときに"], "en_chunks": ["Problems of loneliness", "often start", "when people stop work."]}, {"id": "u12s025", "group": 12, "ja_chunks": ["仕事に行くことは", "大部分の人々にとって", "最も重要なことである", "生活の中で"], "en_chunks": ["Going to work is,", "for most people,", "the most important thing", "in their lives."]}, {"id": "u12s026", "group": 12, "ja_chunks": ["仕事のおかげで人々は", "自分に自信が持てる", "そして仕事を通して", "彼らはいつも連絡を保っている", "友人と"], "en_chunks": ["Work makes people", "proud of themselves,", "and through work,", "they are always in touch", "with their friends."]}, {"id": "u12s027", "group": 12, "ja_chunks": ["仕事をやめたとき", "(男性は65歳、女性は60歳で)", "しばしば難しい", "彼らにとって", "新しい人生を始めることは", "仕事なしに"], "en_chunks": ["When people stop work", "(men at sixty-five, women at sixty),", "it is often difficult", "for them", "to start a new life", "without their jobs."]}, {"id": "u12s028", "group": 12, "ja_chunks": ["世の中は変化してきた", "とても速く", "初めから", "今世紀の", "なので難しい", "高齢者にとって", "問題を理解することは", "若い人たちの"], "en_chunks": ["The world has changed", "so fast", "since the beginning", "of this century", "that it is difficult", "for old people", "to understand the problems", "of young people."]}, {"id": "u12s029", "group": 12, "ja_chunks": ["80歳の人々が", "今日の", "子どもだったとき", "飛行機はなかった", "ラジオやテレビも"], "en_chunks": ["When the eighty-year-old people", "of today", "were children,", "there were no planes,", "radios or TV sets."]}, {"id": "u12s030", "group": 12, "ja_chunks": ["もっと多くのものがある", "今日の世の中には", "そこになかった (ものが)", "彼らの子ども時代には"], "en_chunks": ["There are many more things", "in the world today", "that were not there", "in their childhood."]}, {"id": "u12s031", "group": 12, "ja_chunks": ["そして", "世の中は変化している", "ずっと速く", "最近", "50年前よりも"], "en_chunks": ["And", "the world is changing", "even faster", "these days", "than it was fifty years ago."]}, {"id": "u12s032", "group": 12, "ja_chunks": ["あなたは不思議に思い始めている", "そうですね"], "en_chunks": ["You begin to wonder,", "don't you?"]}, {"id": "u12s033", "group": 12, "ja_chunks": ["どのようになるのだろうかと", "今日の", "若い人たちが", "年をとったとき"], "en_chunks": ["What will it be like", "when today's", "young people", "are old?"]}, {"id": "u13s001", "group": 13, "ja_chunks": ["なぜ私たちの地球は", "現在のような惑星の形態なのだろうか"], "en_chunks": ["Why is our earth", "the kind of planet it is?"]}, {"id": "u13s002", "group": 13, "ja_chunks": ["からだけではない", "地球は満ちている", "多くのもので"], "en_chunks": ["Not only because", "it is full", "of a number of things."]}, {"id": "u13s003", "group": 13, "ja_chunks": ["からだけではない", "いくつかの部分は", "もっと満ちている", "もので", "他の部分よりも"], "en_chunks": ["Not only because", "some parts", "are more full", "of things", "than others."]}, {"id": "u13s004", "group": 13, "ja_chunks": ["からでもある", "地球にあるものは", "関連している"], "en_chunks": ["But also because", "the things in it", "are related."]}, {"id": "u13s005", "group": 13, "ja_chunks": ["地球は", "時計に似ている"], "en_chunks": ["The earth", "is like a watch."]}, {"id": "u13s006", "group": 13, "ja_chunks": ["偶然に生じたものは何もない", "時計の構造には"], "en_chunks": ["There's nothing accidental", "about the mechanism of a watch."]}, {"id": "u13s007", "group": 13, "ja_chunks": ["それぞれの部品は", "機能している部品である", "そしてそれぞれが絶対に必要である", "時計を動かすために"], "en_chunks": ["Each part", "is a working part", "and each is absolutely necessary", "to make the watch go."]}, {"id": "u13s008", "group": 13, "ja_chunks": ["その上", "時計は作動できる", "それぞれの部品が", "適切に連結されてはじめて", "他の部品と"], "en_chunks": ["Furthermore,", "the watch can go", "only when each part", "is properly connected", "with other parts."]}, {"id": "u13s009", "group": 13, "ja_chunks": ["地球のすべての部分は", "同様に機能している部品である", "そして必要である", "地球を「動かす」ために"], "en_chunks": ["All the parts of the earth", "are likewise working parts,", "and are necessary", "to make it \"go.\""]}, {"id": "u13s010", "group": 13, "ja_chunks": ["地形的特徴を考えなさい", "グランドキャニオンのような", "コロラド川の", "そして富士山のような", "日本の"], "en_chunks": ["Consider physical features", "such as the Grand Canyon", "of the Colorado River", "and Mt. Fuji,", "in Japan."]}, {"id": "u13s011", "group": 13, "ja_chunks": ["それらは結果である", "関係の", "陸地と", "水と", "空気との間の"], "en_chunks": ["They are the result", "of relationships", "between the land,", "the water, and", "the air."]}, {"id": "u13s012", "group": 13, "ja_chunks": ["これらの関係は", "始まった", "何百万年も前に", "そして続いている", "まさに今日まで"], "en_chunks": ["These relationships", "started", "millions of years ago", "and have continued", "to this very day."]}, {"id": "u13s013", "group": 13, "ja_chunks": ["別の点がある", "地球が"], "en_chunks": ["There's another way in which the earth", "resembles a watch."]}, {"id": "u13s014", "group": 13, "ja_chunks": ["時計に似ている / それは精密機器である"], "en_chunks": ["It's a precision instrument."]}, {"id": "u13s015", "group": 13, "ja_chunks": ["時計とは違って", "それは何の兆候も示さない", "動かなくなったり止まったりする"], "en_chunks": ["Unlike a watch,", "it shows no sign", "of running down or stopping."]}, {"id": "u13s016", "group": 13, "ja_chunks": ["「種まきの時期と収穫期", "寒さと暑さ", "夏と冬", "そして昼と夜」は", "来続ける", "決まったときに"], "en_chunks": ["\"Seed time and harvest,", "and cold and heat,", "and summer and winter,", "and day and night\"", "continue to arrive,", "on time."]}, {"id": "u13s017", "group": 13, "ja_chunks": ["私たちはどのように理解するのだろうか", "時計がどのように動くのかを"], "en_chunks": ["How do we understand", "how a watch works?"]}, {"id": "u13s018", "group": 13, "ja_chunks": ["知ることによってのみ(理解できるのだ)", "どのような用途か", "それぞれのバネ、歯車、大歯車が役立っているのは", "そしてその部品がどのように", "くっついているのかを"], "en_chunks": ["Only by knowing", "what use", "each spring, gear, and wheel serves,", "and how the parts", "hang together."]}, {"id": "u13s019", "group": 13, "ja_chunks": ["同様に", "私たちは理解できる", "私たちの地球がどのように動くのかを", "知ることができるようになってはじめて", "各部品", "とそれらの間の関係を"], "en_chunks": ["In the same way,", "we can understand", "how our world works", "only by getting to know", "the parts", "and the relationships between them."]}, {"id": "u13s020", "group": 13, "ja_chunks": ["これはしかしながら簡単なことではない", "たとえそれが少しでもできるとしても"], "en_chunks": ["This, however, is not easy,", "even if it could be done at all."]}, {"id": "u13s021", "group": 13, "ja_chunks": ["というのは", "あるからだ 機能している部品ははるかにたくさん", "地球に対して", "時計よりも", "あるいは他のどんな精密機器よりも"], "en_chunks": ["For", "there are far more working parts", "to the earth", "than to a watch", "or any other precision instrument."]}, {"id": "u13s022", "group": 13, "ja_chunks": ["まだだれも正確には知らない", "機能している部品がいくつあるのかを"], "en_chunks": ["Nobody yet knows exactly", "how many working parts there are."]}, {"id": "u13s023", "group": 13, "ja_chunks": ["結局", "地球のいくつかの部品が", "いまだにかろうじて知られている程度だ"], "en_chunks": ["After all,", "some parts of the world", "are still barely known."]}, {"id": "u13s024", "group": 13, "ja_chunks": ["南極大陸の広い範囲は未踏のままである"], "en_chunks": ["Large areas of Antarctica remain unexplored."]}, {"id": "u13s025", "group": 13, "ja_chunks": ["広い範囲もまたそうである", "大気と大洋の", "両方とも活動している", "ずっと", "冷やしたり温めたり", "乾かしたり湿らせたりして", "地表を", "地球の"], "en_chunks": ["So are large areas", "of the atmosphere and the oceans,", "both of which are at work", "all the time", "cooling and warming,", "drying and moistening", "the land surfaces", "of the earth."]}, {"id": "u13s026", "group": 13, "ja_chunks": ["さらにまた", "関係のいくつかは", "既知の機能している部品の間にある", "完全には理解されていない"], "en_chunks": ["Then again,", "some of the relationships", "between the known working parts", "are not fully understood."]}, {"id": "u14s001", "group": 14, "ja_chunks": ["人間は", "最も高等な産物である", "進化上の"], "en_chunks": ["Human beings", "are the highest product", "of evolution."]}, {"id": "u14s002", "group": 14, "ja_chunks": ["人間の知能は", "はるかにすぐれている", "他のいかなる有機体の知能よりも"], "en_chunks": ["Human intelligence", "is far superior", "to that of any other organism."]}, {"id": "u14s003", "group": 14, "ja_chunks": ["構造上", "人間の体は", "密接に関係している", "体と", "チンパンジーの", "ゴリラ、オランウータン、そしてテナガザルの"], "en_chunks": ["In structure,", "the human body", "is closely related", "to those", "of the chimpanzees,", "gorillas, orangutans, and gibbons."]}, {"id": "u14s004", "group": 14, "ja_chunks": ["しかしこのことは意味しない", "人間が", "進化したということを", "これら類人猿のいずれかから"], "en_chunks": ["But this does not mean", "that human beings", "evolved", "from any of these apes."]}, {"id": "u14s005", "group": 14, "ja_chunks": ["研究から", "化石の", "科学者たちは考えている", "古代の人間", "そして類人猿は", "共通の祖先を持っていたと", "何百万年前には"], "en_chunks": ["From their study", "of fossils,", "scientists think", "that ancient humans", "and apes", "had common ancestors", "millions of years ago."]}, {"id": "u14s006", "group": 14, "ja_chunks": ["類人猿と人間は", "進化した / 異なる方向で", "そして適応するようになった", "異なる生活様式に"], "en_chunks": ["Apes and humans evolved", "in different directions", "and became adapted", "to different ways of life."]}, {"id": "u14s007", "group": 14, "ja_chunks": ["より多くの化石が", "初期の人類の", "発見されているところだ", "年を追って", "そして正確な方法が", "それらの年代を推定する", "開発されている"], "en_chunks": ["More fossils", "of early human beings", "are being discovered", "each year,", "and accurate ways", "of dating them", "are being developed."]}, {"id": "u14s008", "group": 14, "ja_chunks": ["しかし科学者たちは", "いまだに知らない", "完全な歴史を", "人間の進化の"], "en_chunks": ["But scientists", "still do not know", "the complete story", "of human evolution."]}, {"id": "u14s009", "group": 14, "ja_chunks": ["アフリカでは", "科学者たちは発見した", "人間の化石を", "ものであると信じられている", "200万年以上前の"], "en_chunks": ["In Africa,", "scientists have discovered", "human fossils", "that are believed to be", "more than 2,000,000 years old."]}, {"id": "u14s010", "group": 14, "ja_chunks": ["これらの化石のいくつかの中に", "単純な道具が", "発見されている"], "en_chunks": ["Among some of these fossils,", "simple tools", "have been found."]}, {"id": "u14s011", "group": 14, "ja_chunks": ["このように", "科学者たちは知っている", "それらの有史以前の人々は", "道具を作ることができたということを"], "en_chunks": ["Thus", "scientists know", "that those prehistoric people", "could make tools."]}, {"id": "u14s012", "group": 14, "ja_chunks": ["確かに彼らは", "教えることができたのだ", "彼らの子どもたちに", "道具の作り方を", "そしてそれらの使い方を"], "en_chunks": ["They no doubt", "were able to show", "their children", "how to make tools", "and how to use them."]}, {"id": "u14s013", "group": 14, "ja_chunks": ["体と脳は", "初期の人類の", "ゆっくりと進化した"], "en_chunks": ["The bodies and brains", "of early human beings", "slowly evolved."]}, {"id": "u14s014", "group": 14, "ja_chunks": ["彼らは作った", "よりよい道具や武器を", "そしてすぐれた猟師になった"], "en_chunks": ["They made", "better tools and weapons", "and became skillful hunters."]}, {"id": "u14s015", "group": 14, "ja_chunks": ["徐々に", "彼らは学んだ", "お互いに話すことを"], "en_chunks": ["Gradually", "they learned", "to talk with one another."]}, {"id": "u14s016", "group": 14, "ja_chunks": ["彼らは火を発見した", "そして学んだ", "火をおこす方法を"], "en_chunks": ["They discovered fire", "and learned", "how to make it."]}, {"id": "u14s017", "group": 14, "ja_chunks": ["人間は", "「現代的な」体型を持ち続けている", "約10万年もの間"], "en_chunks": ["Human beings", "have had their \"modern\" form", "for about 100,000 years."]}, {"id": "u14s018", "group": 14, "ja_chunks": ["もし何人かが", "最も初期の「現代」人の", "着ていたら", "現代の服を", "あなたは彼らに気づかないだろう", "通りで"], "en_chunks": ["If some", "of the first \"modern\" human beings", "were dressed", "in modern clothes,", "you would not notice them", "on the street."]}, {"id": "u14s019", "group": 14, "ja_chunks": ["しかし", "並行して", "ネアンデルタール人は", "発展してきたが", "絶滅した", "約3万年前に"], "en_chunks": ["But", "in a parallel line,", "the Neanderthal humans,", "who had developed", "became extinct", "about 30,000 years ago."]}, {"id": "u14s020", "group": 14, "ja_chunks": ["彼らは競い合うことができなかったようだ", "うまく", "直系の祖先と", "現代人の"], "en_chunks": ["They apparently could not compete", "successfully", "with the direct ancestors", "of modern humans."]}, {"id": "u14s021", "group": 14, "ja_chunks": ["何千年もの間", "人々は洞穴や、開けた平原に住んでいた", "そしてジャングルに"], "en_chunks": ["For thousands of years,", "people lived in caves, on open plains,", "and in jungles."]}, {"id": "u14s022", "group": 14, "ja_chunks": ["徐々に", "彼らは動物を飼育し始めた", "そして植物を育てた", "自分たちで使うために"], "en_chunks": ["Gradually", "they began to train animals", "and grow plants", "for their own use."]}, {"id": "u14s023", "group": 14, "ja_chunks": ["やがて", "彼らは", "始めた", "記録を残し", "自分たちの歴史の"], "en_chunks": ["In time,", "they", "began to", "keep records", "of their history."]}, {"id": "u14s024", "group": 14, "ja_chunks": ["人間は最初である", "そして唯一の存在である", "探求する", "自分たち自身の進化の歴史を"], "en_chunks": ["They are the first", "and only beings", "to seek out", "their own evolutional history."]}, {"id": "u15s001", "group": 15, "ja_chunks": ["「あなたは思いますか」", "アメリカ文化が", "日本に影響を与えたと", "肯定的に"], "en_chunks": ["\"Do you think", "that American culture", "has influenced Japan", "positively?\""]}, {"id": "u15s002", "group": 15, "ja_chunks": ["アメリカ人の男性が", "私の隣に座っていた", "パーティーで", "私に尋ねた", "この質問を"], "en_chunks": ["An American man,", "sitting next to me", "at a party,", "asked me", "this question."]}, {"id": "u15s003", "group": 15, "ja_chunks": ["私は彼に示した", "というありふれた答えを", "「ある日本人は思う", "アメリカの影響は", "良かったと", "しかし思う日本人もいる", "それは悪い面もあったと」"], "en_chunks": ["I gave him", "a commonplace answer like,", "\"Some Japanese think", "that the American influence", "has been positive,", "but others think", "that it has been negative.\""]}, {"id": "u15s004", "group": 15, "ja_chunks": ["彼の顔の表情を見て", "私はわかった", "彼は聞いたのだと", "同様に不満足な答えを", "他の日本人から"], "en_chunks": ["The look on his face", "told me", "that he had gotten", "similarly unsatisfactory answers", "from other Japanese."]}, {"id": "u15s005", "group": 15, "ja_chunks": ["彼にとって、「あなた」という言葉は", "「あなた自身」を意味した", "しかし私にとっては", "集団協調の理由から、「あなた」は", "「あなたたち日本人」を意味した"], "en_chunks": ["To him, the word \"you\"", "meant \"you yourself\";", "but to me,", "because of group harmony, \"you\"", "meant \"you Japanese.\""]}, {"id": "u15s006", "group": 15, "ja_chunks": ["私は慣れていた", "一般的な意見を述べることに", "個人的な意見よりもむしろ"], "en_chunks": ["I was accustomed", "to making a general comment", "rather than a personal one."]}, {"id": "u15s007", "group": 15, "ja_chunks": ["日本では", "私にはめったに機会がなかった", "述べるような", "自分の個人的な意見を"], "en_chunks": ["In Japan,", "I seldom had a chance", "to express", "my personal opinions."]}, {"id": "u15s008", "group": 15, "ja_chunks": ["それらのまれな機会に", "私は述べようとした", "中立的で", "無難な意見を"], "en_chunks": ["On those rare occasions,", "I tried to state", "neutral,", "harmless opinions."]}, {"id": "u15s009", "group": 15, "ja_chunks": ["さもなければ", "反対の意見を表明することは", "不調和を引き起こしてしまうだろう", "そして私は恐れた", "除外されることを", "集団から"], "en_chunks": ["Otherwise,", "expressing contrary opinions", "would cause disorder,", "and I was afraid", "of being excluded", "from the group."]}, {"id": "u15s010", "group": 15, "ja_chunks": ["しかしながら、アメリカ人は学ぶ", "小学校で", "はっきり自分の意見を言うことを"], "en_chunks": ["However, Americans learn", "in elementary school", "to speak out."]}, {"id": "u15s011", "group": 15, "ja_chunks": ["その文化において", "個人的な意見を持たないことは", "無能の表れである"], "en_chunks": ["In that culture,", "having no personal opinions", "is a sign of incapability."]}, {"id": "u15s012", "group": 15, "ja_chunks": ["私は答えた", "「そうですね"], "en_chunks": ["I answered,", "\"Well, let me see."]}, {"id": "u15s013", "group": 15, "ja_chunks": ["アメリカの文化は", "引き上げてくれました", "女性の地位を", "日本での", "大変"], "en_chunks": ["American culture", "has raised", "women's status", "in Japan,", "very much."]}, {"id": "u15s014", "group": 15, "ja_chunks": ["女性は", "もっとできるようになりました", "自分たちの能力を示すことが"], "en_chunks": ["Women", "have become more able", "to display their abilities."]}, {"id": "u15s015", "group": 15, "ja_chunks": ["そして私はそのことに感謝しています」"], "en_chunks": ["and I appreciate that.\""]}, {"id": "u15s016", "group": 15, "ja_chunks": ["それでもなお", "私は本当に満足してはいなかった", "自分の意見に", "それがあまりに平凡だったので"], "en_chunks": ["Still,", "I wasn't truly satisfied", "with my comment", "because it was so ordinary."]}, {"id": "u15s017", "group": 15, "ja_chunks": ["その出来事の後も、私は", "まだしがちだった", "一般的な返答を", "「私たち日本人は…」と言うことで"], "en_chunks": ["After that incident, I", "was still apt to give", "general responses", "by saying \"We Japanese..\""]}, {"id": "u15s018", "group": 15, "ja_chunks": ["尋ねられたとき", "「どう思いますか", "国際結婚について」"], "en_chunks": ["When asked,", "\"What do you think", "about international marriage?\""]}, {"id": "u15s019", "group": 15, "ja_chunks": ["私は答えた、「私たち日本人は保守的です", "したがって、一般的に言うと、両親は反対します", "国際結婚に」"], "en_chunks": ["I replied, \"We Japanese are conservative", "so, generally speaking, parents object", "to international marriage.\""]}, {"id": "u15s020", "group": 15, "ja_chunks": ["そこで再び", "私はいらだちの響きを聞いた", "そのアメリカ人男性の声の中に", "「私は求めているのです", "あなたの個人的な意見を」"], "en_chunks": ["There again,", "I heard the irritation", "in the American man's voice:", "\"I'm asking for", "your personal opinion.\""]}, {"id": "u15s021", "group": 15, "ja_chunks": ["彼の顔の表情は", "十分強かったので", "突破するのに", "日本人の壁を", "そこで私は言った", "「もし2人が理解し合い", "愛し合っているなら", "だれが国籍を気にするでしょうか」"], "en_chunks": ["His facial expression", "was strong enough", "to break through", "the Japanese wall", "and I said:", "\"If the two people understand", "and love each other,", "who cares about nationality?\""]}, {"id": "u15s022", "group": 15, "ja_chunks": ["それから", "静かに彼は尋ねた、「もしあなたの両親が反対したら", "あなた自身の国際結婚に", "あなたはどうしますか"], "en_chunks": ["Then,", "softly he inquired, \"If your parents objected", "to your own international marriage,", "what would you do?"]}, {"id": "u15s023", "group": 15, "ja_chunks": ["アメリカでは", "親の許可は", "必要ありません", "しかしあなたの国では", "必要です", "そうですよね」"], "en_chunks": ["In the U.S.,", "parental permission", "is not necessary,", "but in your country", "you need it,", "right?\""]}, {"id": "u15s024", "group": 15, "ja_chunks": ["私は答えた", "「その通りです", "しかし法律的に必要なのではありません"], "en_chunks": ["I answered:", "\"Right,", "but not legally."]}, {"id": "u15s025", "group": 15, "ja_chunks": ["私は説得しようとするでしょう", "両親を", "私に許可を与えるよう"], "en_chunks": ["I would try to persuade", "my parents", "to give me permission."]}, {"id": "u15s026", "group": 15, "ja_chunks": ["日本人として", "私は思いません", "両親と私は", "まったく別個の存在だとは", "異なる人格を持つ」"], "en_chunks": ["As a Japanese,", "I don't think", "my parents and I", "are completely separate beings", "with different personalities.\""]}, {"id": "u15s027", "group": 15, "ja_chunks": ["彼は続けた", "「もしあなたの両親が", "反対することに固執したら", "あなたはどうしますか」"], "en_chunks": ["He continued:", "\"If your parents", "persisted in objecting,", "what would you do?\""]}, {"id": "u15s028", "group": 15, "ja_chunks": ["私は答えた", "「私の両親は言います", "もしその男性が", "温かい人柄で", "意思を伝え合えるなら", "自分たちと", "日本語で", "自分たちは許すだろう", "結婚式を挙げることを"], "en_chunks": ["I replied:", "\"My parents say", "that if the man", "had a warm personality", "and could communicate", "with them", "in Japanese,", "they would allow", "the marriage to take place."]}, {"id": "u15s029", "group": 15, "ja_chunks": ["多くの文化的違いにもかかわらず", "私はあらゆる努力をするでしょう", "両親を説得するために」"], "en_chunks": ["Despite the many cultural differences,", "I would make every effort", "to win my parents over.\""]}, {"id": "u15s030", "group": 15, "ja_chunks": ["自由なやりとりを通して", "意見の", "会話は進んだ", "円滑に"], "en_chunks": ["Through free interchange", "of opinions,", "the conversation developed", "smoothly."]}, {"id": "u15s031", "group": 15, "ja_chunks": ["促すことによって", "さらに率直な意見の交換を", "私たちはできた", "理解し認識することが", "お互いの文化を", "よりよく"], "en_chunks": ["By encouraging", "further frank give-and-take,", "we were able", "to understand and appreciate", "each other's culture", "better."]}, {"id": "u16s001", "group": 16, "ja_chunks": ["多くの人々は信じている", "自動車は", "非常に一般的に使用されているので", "アメリカで", "それは発明されたと", "アメリカ合衆国で"], "en_chunks": ["Many people believe that", "because the automobile", "is in such general use", "in America", "it was invented", "in the United States."]}, {"id": "u16s002", "group": 16, "ja_chunks": ["それは事実ではない"], "en_chunks": ["That is not true."]}, {"id": "u16s003", "group": 16, "ja_chunks": ["ガソリン自動車は", "私たちが知るような", "フランスとドイツで生まれた"], "en_chunks": ["The gasoline motor-car", "that we know", "began in France and Germany."]}, {"id": "u16s004", "group": 16, "ja_chunks": ["アメリカ人が実際に発明したものは", "方法だった", "車を製造する", "大変多くの", "ついに", "世界で首位となった", "生産台数で", "世界のすべての自動車の約75%を製造するまでになったほどの"], "en_chunks": ["What Americans did invent", "was a method", "of manufacturing cars", "in such numbers", "that in the end", "they led the world", "in production,", "producing some seventy-five percent of all the world's cars."]}, {"id": "u16s005", "group": 16, "ja_chunks": ["1つの理由は", "自動車の運転が", "より速く進歩した", "初期においては", "道路が", "はるかによかったことであった"], "en_chunks": ["One reason", "why motoring", "progressed more quickly", "at the start,", "was that the roads", "were so much better."]}, {"id": "u16s006", "group": 16, "ja_chunks": ["いかなる分野にもない", "社会的,経済的発展における", "アメリカ合衆国には", "ヨーロッパよりこれほどまでに遅れをとっている", "道路の点においてほど"], "en_chunks": ["In no branch", "of social and economic development", "was the United States", "so far behind Europe", "as in its roads."]}, {"id": "u16s007", "group": 16, "ja_chunks": ["多くの理由があった", "これには"], "en_chunks": ["There were a number of reasons", "for this."]}, {"id": "u16s008", "group": 16, "ja_chunks": ["そのような基盤が", "何千マイルもの", "立派な幹線の", "敷かれていた", "ローマ人によって", "数百年前に", "そのような基盤が存在し", "準備ができていたのだ", "後ほど作り替えられる", "なめらかな道路面へと", "技術者によって"], "en_chunks": ["the hard base", "for thousands of miles", "of good highways", "had been laid", "by the Romans", "hundreds of years before;", "it was there,", "ready to be", "later built up", "into fine smooth surfaces", "by engineers."]}, {"id": "u16s009", "group": 16, "ja_chunks": ["第2に、ヨーロッパでの距離は", "あまり長くはなかった", "そして", "町や村の数が多かったことが", "互いにかなり接近した", "道路建設を節約させた"], "en_chunks": ["Second, distances there", "were not very great,", "and", "the large number of towns and villages", "all quite near one another", "made roadbuilding economical."]}, {"id": "u16s010", "group": 16, "ja_chunks": ["広大な無人地帯では", "アメリカ大陸の", "一方", "より簡単でより安く上がった", "川や湖を使うこと", "そして運河を造ること", "あるいは鉄道を敷くことのほうが"], "en_chunks": ["In the great unpeopled spaces", "of the American continent,", "on the other hand,", "it was easier and cheaper", "to use the rivers and lakes", "and to make canals", "or put down railroads."]}, {"id": "u16s011", "group": 16, "ja_chunks": ["アメリカの道路は", "始まりを持っていた", "小道から", "インディアンによって使われた", "あるいは踏み固められた小道", "牛によって"], "en_chunks": ["American roads", "had their beginning", "in the paths", "used by Indians", "or those stamped out", "by cattle."]}, {"id": "u16s012", "group": 16, "ja_chunks": ["それらの大部分は", "泥の海になった", "雨が降ると、そしてそれから使うことができた", "丸太が敷かれた場合にのみ", "その上に"], "en_chunks": ["Most of them", "became seas of mud", "when it rained, and could then be used", "only if logs had been laid", "across them."]}, {"id": "u16s013", "group": 16, "ja_chunks": ["そうすると難しくない", "理解することは、どうしてアメリカ人の大部分が", "考えなかったのか、彼らが見たとき", "最初の数台の自動車が", "町の通りを「疾走する」のを", "10か15マイルの速さで", "時速", "とてもわくわくするような"], "en_chunks": ["So it is not hard", "to understand why most Americans", "did not see, as they watched", "the first few automobiles", "\"speeding\" along town streets", "at ten or fifteen miles", "an hour,", "anything to get very excited about."]}, {"id": "u16s014", "group": 16, "ja_chunks": ["農夫のような人々にとって", "ようだった、車は決して取って代わることができない", "馬に"], "en_chunks": ["To people like farmers", "it seemed that the car could never take the place", "of the horse."]}, {"id": "u16s015", "group": 16, "ja_chunks": ["結局", "馬は", "自分の動力装置を持っていた", "それは必要とした", "栽培されるものだけ", "農場で", "そして戻した", "農場に", "考えうる最良の有機肥料を"], "en_chunks": ["After all, d the officer", "return the fire?"]}, {"id": "u18s008", "group": 18, "ja_chunks": ["もし彼が応戦したら", "彼は危険にさらすかもしれない 生命を逃げる市民たちの"], "en_chunks": ["If he does,", "he may endanger the lives of the fleeing citizens."]}, {"id": "u18s009", "group": 18, "ja_chunks": ["もし彼が応戦しなければ", "逮捕できないかもしれない", "犯人を", "あるいは彼自身が撃たれるかもしれない"], "en_chunks": ["If he doesn't,", "he may fail to arrest", "the criminal,", "or he may himself get shot."]}, {"id": "u18s010", "group": 18, "ja_chunks": ["仮定してください", "警察官が", "応戦することを決断すると", "仮定してください", "強盗は", "逮捕される", "しかしかなりの見物人", "もまた負傷すると"], "en_chunks": ["Assume", "the officer", "decides to return the fire;", "assume", "the robber", "is captured", "but some bystander", "is also wounded."]}, {"id": "u18s011", "group": 18, "ja_chunks": ["新聞は", "おそらく圧力をかけるだろう", "いわゆる「西部劇」方式に", "警察権力による"], "en_chunks": ["The newspapers", "will no doubt bring pressure", "on the so-called \"wild West\" ways", "of the police force."]}, {"id": "u18s012", "group": 18, "ja_chunks": ["通常", "警察官には本当にすぐれた選択肢などないのだ", "即時の決断の大部分は", "彼がしなければならない", "例のようなものである", "すなわち災害の選択なのである"], "en_chunks": ["Usually,", "the officer has no truly excellent alternatives;", "most of the on-the-spot decisions", "he must make", "are like the example:", "a choice of evils."]}, {"id": "u18s013", "group": 18, "ja_chunks": ["不思議ではない", "警察官が", "葛藤が生じるのは", "圧迫感から", "1つの災害を選択するという", "すばやい決断で", "そして彼の本当の願望から", "窮地から脱したいという", "その問題を避けることによって"], "en_chunks": ["No wonder", "the policeman", "is in conflict", "from the pressure", "to choose one evil", "through a quick decision", "and his real desire", "to get himself off the hook", "by avoiding the issue."]}, {"id": "u18s014", "group": 18, "ja_chunks": ["警察官は", "常に現場にいる", "そしてしなければならないので", "災害を選択するという決断を", "彼はまたいらだちを感じるかもしれない", "人々に対して", "必要のない", "あえて危険に身をさらす"], "en_chunks": ["Because the officer", "is always on the hot spot", "and has to make", "choice-of-evil decisions,", "he may also feel", "irritated", "with people", "who don't have to stick their necks out."]}, p,", "Louis Braille", "became an accomplished cellist,", "organist,", "and scholar."]}, {"id": "u20s007", "group": 20, "ja_chunks": ["他の目が見えない人たちと同様に", "彼の時代の", "文字を読むための方法は", "彼に利用できた", "めんどうなものにすぎなかった / よく見ても"], "en_chunks": ["Like other blind individuals", "of his time,", "the methods of reading", "available to him were cumbersome", "at best."]}, {"id": "u20s008", "group": 20, "ja_chunks": ["触発されて", "フランス人陸軍大尉シャルル・バルビエによって", "その方式が", "考案されて", "1819年に", "軍事通信用に", "夜間の", "それで呼ばれた", "「夜間文字」と", "若き", "ブライユは", "縮小した", "それぞれは構成された", "1つから6つの浮き出しにされた点で", "配置された"], "en_chunks": ["Inspired", "by French army captain Charles Barbier,", "whose system", "was invented", "in 1819", "for military communication", "at night", "and was called", "\"night-writing,\"", "young", "Braille", "reduced", "each composed", "of one to six embossed dots arranged", "in a six-position cell or matrix."]}, {"id": "u20s009", "group": 20, "ja_chunks": ["ルイ・ブライユは", "教授であり以前の生徒だった", "視覚障害児協会の", "パリの", "彼の成果を発表した", "1829年に / そしてそれから再び", "もっと包括的な形態で", "1832年において"], "en_chunks": ["Louis Braille,", "a professor and former student", "at the Institute for Blind Children", "in Paris,", "published his results in 1829", "and then again", "in a more comprehensive form", "in 1832."]}, {"id": "u20s010", "group": 20, "ja_chunks": ["経て", "長い期間を", "熟成と改良の", "他の人々による", "ブライユ点字法は", "コミュニケーションの方式としての", "達成した", "世界的な名声と認知を", "1916年に / アメリカの上院の議員が会ったとき", "イギリス政府の代表者と", "ロンドンで"], "en_chunks": ["Through", "a long period", "of fermentation and modification", "by others,", "Braille,", "as a system of communication,", "achieved", "worldwide prominence and acceptance in 1916,", "when members of the U.S. Senate met", "with representatives of the British government", "in London to approve the system."]}, {"id": "u20s011", "group": 20, "ja_chunks": ["その方式を認可するために / それは一般的に呼ばれている", "標準英語点字", "2級と"], "en_chunks": ["It is commonly referred to", "as Standard English Braille,", "Grade 2."]}, {"id": "u20s012", "group": 20, "ja_chunks": ift his spirits,", "\"because you're living", "in Japan", "the chances", "are very good", "that you'll", "get your bag back."]}, {"id": "u24s016", "group": 24, "ja_chunks": ["実際に", "可能性は極めて高いよ」"], "en_chunks": ["In fact,", "they are excellent.\""]}, {"id": "u24s017", "group": 24, "ja_chunks": ["「そうだといいんだけど"], "en_chunks": ["\"I hope so."]}, {"id": "u24s018", "group": 24, "ja_chunks": ["ああ", "そうなることを願います」とトムは言った"], "en_chunks": ["God,", "I hope so,\" said Tom."]}, {"id": "u24s019", "group": 24, "ja_chunks": ["私の予想通り", "電話が", "再び鳴ったとき", "1時間ほどして", "相手は若い日本人だった", "タカカワダイスケという名前の", "電話で言った", "バッグは", "彼が持っていると"], "en_chunks": ["True to my prediction,", "when the phone", "rang again", "about an hour or so later,", "it was a young Japanese", "named Daisuke Takakawa,", "calling to say", "that the bag", "was in his hands."]}, {"id": "u24s020", "group": 24, "ja_chunks": ["仕事へ行く途中で、彼の母は", "それを見つけた", "上に", "ゴミの山の", "そしてそれを持っていった", "地元の交番に", "しかし結局交番は閉まっているとわかっただけだった"], "en_chunks": ["While on her way to work, his mother", "had spotted it", "on the top", "of a heap of garbage", "and had taken it", "to the local police box", "only to find it closed."]}, {"id": "u24s021", "group": 24, "ja_chunks": ["「何が", "ゴミが?」"], "en_chunks": ["\"What, the", "garbage?\""]}, {"id": "u24s022", "group": 24, "ja_chunks": ["と彼は尋ねた"], "en_chunks": ["he asked."]}, {"id": "u24s023", "group": 24, "ja_chunks": ["「違うわ、バッグよ」", "と彼の母は答えた"], "en_chunks": ["\"No, the bag,\"", "his mother replied."]}, {"id": "u24s024", "group": 24, "ja_chunks": ["「とてもいいものよ」"], "en_chunks": ["\"It's a very nice one.\""]}, {"id": "u24s025", "group": 24, "ja_chunks": ["「高価すぎるように見えたの", "そこにあるには」", "彼女は息子に言った", "それを家に持ってきたとき"], "en_chunks": ["\"It looked too valuable", "to be there,\"", "she told her son", "when she took it home."]}, {"id": "u24s026", "group": 24, "ja_chunks": ["タカカワダイスケは", "その中身を調べ", "電話番号を見つけ", "そこに電話をかけた", "すぐに"], "en_chunks": ["Daisuke Takakawa", "searched its contents,", "found a telephone number,", "and dialed upply them."]}, {"id": "u25s002", "group": 25, "ja_chunks": ["南カリフォルニアは", "その模範例である"], "en_chunks": ["Southern California", "is the textbook example."]}, {"id": "u25s003", "group": 25, "ja_chunks": ["ある程度の量がある", "自然の水の", "地域的に利用することができる", "ロサンゼルスという市が", "そのような理由で", "その都市が最初に発達したのである", "そこで"], "en_chunks": ["There is a certain amount", "of natural water", "that is locally available", "for the city of Los Angeles", "- that's why", "the city first grew", "there."]}, {"id": "u25s004", "group": 25, "ja_chunks": ["その地域の水の供給は", "少ないものではない"], "en_chunks": ["That local supply", "is not small."]}, {"id": "u25s005", "group": 25, "ja_chunks": ["ほとんど十分あるのだ", "必要を満たすくらいは", "100万人かそこらの", "しかし絶望的に不足している", "1,400万人を抱えるほどになっている"], "en_chunks": ["It is about enough", "to meet the needs", "of a million people or so", "but it is hopelessly inadequate", "now that the area has exploded to contain fourteen million people."]}, {"id": "u25s006", "group": 25, "ja_chunks": ["ロサンゼルスはすでに", "その中に取り込むために", "流れる", "その州と / 近隣の州を", "そして今では、", "始めてさえいるのだ", "渇望の目を向けることを", "広大なカナダの河川に", "2,000マイル離れた"], "en_chunks": ["That is why Los Angeles has already reached out its aqueducts", "to suck into itself almost everything", "that flows in its own state", "and nearby ones,", "and now", "has even begun", "to cast a thirsty eye", "at the vast Canadian rivers", "two thousand miles away."]}, {"id": "u25s007", "group": 25, "ja_chunks": ["ロサンゼルスや", "この場合においては / 他のカリフォルニア州の都市は", "決してない", "唯一の悪者というわけでは", "その州において"], "en_chunks": ["Everybody criticizes Los Angeles sharply, but", "it and the other California cities", "are by no means", "the only offenders", "in that state."]}, {"id": "u25s008", "group": 25, "ja_chunks": ["カリフォルニア州の農業経営者は", "実際もっとひどい"], "en_chunks": ["California's farmers", "are actually worse."]}, {"id": "u25s009", "group": 25, "ja_chunks": ["全体で", "カリフォルニア州の農業は / 約85%を使用している", "州の水の"], "en_chunks": ["In all, California's agriculture", "uses about 85%", "of the state's water."]}, {"id": "u25s010", "group": 25, "ja_chunks": ["それは思えるかもしれない 十分に正当なことに", "農業経営者は作物を育てなければならないからだ", "人々が食べていけるように", "結局", "しかし", "かなりの量は", "その貴重な水の", "浪費されているのである", "愚かな行為のために", "牧草地を灌漑するといったような", "乳牛のための", "驚くべき1つの事実である", "草に水をやるということが", "牧草のための / 多くの水を消費するということは", "毎年", "2つの都市よりも", "ロサンゼルスとサンフランシスコの"], "en_chunks": ["That might seem fair enough", "- farmers must grow crops", "so that people can eat,", "after all", "but", "a huge amount", "of that precious water", "is wasted", "on such foolish acts", "as irrigating pastureland", "for dairy cattle;", "it is an astonishing fact", "that watering grass for pasture", "swallows more water", "every year", "than the cities", "of Los Angeles and San Francisco combined."]}, {"id": "u25s011", "group": 25, "ja_chunks": ["それでもなおこれらカリフォルニア州の都市は", "十分にひどい状況だ", "芝生", "噴水", "そしてジャクージがあって"], "en_chunks": ["Still,", "these California cities are bad enough,", "with their lawns,", "fountains", "and jacuzzis."]}, {"id": "u25s012", "group": 25, "ja_chunks": ["都市のいくつかは", "近隣の州の", "アリゾナ州やネバダ州といった", "さらにひどい"], "en_chunks": ["Some of the cities", "in the neighboring states,", "Arizona and Nevada,", "are even worse."]}, {"id": "u25s013", "group": 25, "ja_chunks": ["これらのからからに乾いた州は", "大都市を建設してしまった", "かつては何もなかった場所に", "サボテン以外は"], "en_chunks": ["These bone-dry states", "have built large cities,", "where there used to be nothing", "but cactus."]}, {"id": "u25s014", "group": 25, "ja_chunks": ["ラスベガスは", "これらの大都市の1つであり / 明らかな意義を持っていないのだが", "存在の", "場所を提供すること以外の", "ギャンブルの", "散在しているのである", "1エーカーもあるプール", "噴水 / 装飾的な池", "水をまかれた芝生", "そして20以上もの灌漑されたゴルフコースが", "水の1滴1滴は", "都市での生活をする", "豪華なものに", "引かれているのである", "すでに過剰取水されているコロラド川から"], "en_chunks": ["Las Vegas, which is one of these large cities", "and has no apparent purpose", "for existence", "except to provide a place", "for gambling,", "is studded", "with acre-sized pools, fountains,", "decorative ponds,", "sprinkled lawns", "and more than twenty irrigated golf courses;", "every drop of the water", "that makes life in the city", "luxurious", "is drawn", "from the already overexploited Colorado River."]}, {"id": "u26s001", "group": 26, "ja_chunks": ["サラは始めた", "犬の訓練を", "そしてすぐに気づいた", "本当は訓練しているのだと", "飼い主を"], "en_chunks": ["Sara got her start", "training dogs", "and soon realized", "she was really training", "their owners."]}, {"id": "u26s002", "group": 26, "ja_chunks": ["「私はいつも飼い主の皆さんに教えていました", "犬がしたことに一貫して反応することについて", "良い行動をとればほうびがもらえ、悪い行動をとったときには罰が与えられるように"], "en_chunks": ["\"I would teach people", "about reacting consistently to what the dogs did", "so that good behavior was rewarded and bad behavior punished."]}, {"id": "u26s003", "group": 26, "ja_chunks": ["私は内心では思っていました", "犬ではなく", "一貫していないのは", "この点で", "人間なのだと」"], "en_chunks": ["And I thought to myself,", "it's not the dogs", "that are being inconsistent", "in this respect,", "it's the people.\""]}, {"id": "u26s004", "group": 26, "ja_chunks": ["サラはあらゆるタイプの飼い主を見ている。"], "en_chunks": ["Sara sees all kinds."]}, {"id": "u26s005", "group": 26, "ja_chunks": ["「くすくす笑う人たちもいます", "言っている", "『かわいいじゃないの』と", "子犬が靴下にかみついてひったくったときは", "飼い主の手から", "そして怒りだすのです", "子犬が飛びかかると", "靴下に", "靴に", "ソファーに"], "en_chunks": ["\"You have the gigglers", "who say,", "'Isn't that cute,'", "when the puppy grabs their socks", "out of their hand", "and then get upset", "when the puppy goes for", "the socks,", "the shoes,", "the couch."]}, {"id": "u26s006", "group": 26, "ja_chunks": ["男女もいます", "一方が厳しく接しようとするのに", "もう一方が", "なかったことにしてしまおうとする", "犬がしたときに", "何か不始末を」"], "en_chunks": ["You have the couples", "where one takes the strict approach", "and the other", "tries to cover up", "when the dog does", "something wrong.\""]}, {"id": "u26s007", "group": 26, "ja_chunks": ["「犬が求めているのは」", "とサラは言う", "「あなたの愛情であり、思いやりであり、喜びなのです"], "en_chunks": ["\"What dogs want,\"", "says Sara,", "\"is your love, attention, and treats."]}, {"id": "u26s008", "group": 26, "ja_chunks": ["もしもそうするなら", "十分に明らかにし、", "必要なものを", "そのような反応を得るために", "(それが)首尾一貫しているなら", "犬は行儀よくふるまいます", "自分の利益のために"], "en_chunks": ["If you make it", んでも積極的に頑張る人と", "怠け者の最たる人との"], "en_chunks": ["What is the difference", "between the most driven", "and the laziest person?"]}, {"id": "u26s017", "group": 26, "ja_chunks": ["それは自分の利益である"], "en_chunks": ["Self-interest."]}, {"id": "u26s018", "group": 26, "ja_chunks": ["私たちは皆している", "私たちがしていることを", "自分の利益のために", "考えているのである", "それが一番いいからだと", "自分にとって"], "en_chunks": ["We all do", "what we do", "because of self-interest;", "we think", "it's the best thing", "for us."]}, {"id": "u26s019", "group": 26, "ja_chunks": ["一生懸命に働く人は", "そうするのである", "信じるからこそ", "報酬が", "待っていると", "自分の努力を正当化するだけでなく", "献身も必要とする"], "en_chunks": ["Those who work hard", "do so", "because they believe", "there is a reward", "awaiting them", "that not only justifies their efforts", "but also demands their dedication."]}, {"id": "u26s020", "group": 26, "ja_chunks": ["精魂を傾けない人は", "仕事から得られる", "そうするのである", "想像できないから", "長期的な利益のほうが", "仕事の", "上回るということを", "短期的な利益に", "怠惰から得る"], "en_chunks": ["Those who do not give their best efforts", "on the job", "do so", "because they cannot see", "the long-term benefit", "of work", "outweighing", "the short-term benefit", "of laziness."]}, {"id": "u26s021", "group": 26, "ja_chunks": ["思い出しなさい", "価値を", "ものの", "自分が望む", "あなたが支払う代償が", "努力することに", "それほど大きくはないと感じられるだろう"], "en_chunks": ["Remind yourself", "of the value", "of the things", "you want,", "and the cost to you", "in effort", "will not feel as great."]}, {"id": "u27s001", "group": 27, "ja_chunks": ["私が生きている間に", "新しい職業が現れた", "科学ジャーナリストという職業だ"], "en_chunks": ["During my lifetime,", "a new profession has arisen", "- that of science journalist."]}, {"id": "u27s002", "group": 27, "ja_chunks": ["今日,", "一般の人たちは学ぶ", "科学について", "主として科学者からではなく", "科学作家やプロデューサーから", "ラジオやテレビ番組の"], "en_chunks": ["Today,", "the public learn", "about science,", "not in the main from scientists,", "but from science writers and from producers", "of radio and television programmes."]}, {"id": "u27s003", "group": 27, "ja_chunks": ["そうではなかった", "50年前は"], "en_chunks": ["It was not so", "fifty years ago."]}, {"id": "u27s004", "group": 27, "ja_chunks": ["私は科学をいっさい教わらなかった", "だが、18歳になるときまでに", "身につけていた", "見事な基礎知識を", "科学の", "ジーンズや", "エディントン、ホールデン、ハックスレイ、ウェルズ、", "アインシュタイン", "そしてシェリントンの著書を読むことで"], "en_chunks": ["I was taught no science at school,", "but by the time I was eighteen", "I had given myself", "an admirable grounding", "in science", "by reading Jeans,", "Eddington, Halden, Huxley, Wells,", "Einstein", "and Sherrington."]}, {"id": "u27s005", "group": 27, "ja_chunks": ["こうした人たちは皆、", "科学書を書いていた", "一般大衆向けに", "そして、", "H. G. ウェルズを除いて", "科学者だった"], "en_chunks": ["All these men were", "writing science", "for the general public,", "and all,", "except H. G. Wells,", "were scientists."]}, {"id": "u27s006", "group": 27, "ja_chunks": ["どの子どもにも", "同じ 科学的な 仕事を", "今日、", "科学は徐々に浸透していくことになるだろう", "人々の考え方を通して", "このような新しい職業に携わる"], "en_chunks": ["For any child trying to do", "the same job", "today,", "the science would be filtered", "through the minds", "of this new profession."]}, {"id": "u27s007", "group": 27, "ja_chunks": ["どのような種類の仕事を", "彼らは今しているのだろうか"], "en_chunks": ["What kind of a job", "are they doing?"]}, {"id": "u27s008", "group": 27, "ja_chunks": ["まず。", "2つの理由がある", "こうした新しい職業の", "出現が"], "en_chunks": ["First,", "there are two reasons why the emergence", "of the new profession", "has been inevitable."]}, {"id": "u27s009", "group": 27, "ja_chunks": ["1つには挙げられる", "科学があまりに重要になりすぎて", "任せておくことができなくなったことが", "科学者に"], "en_chunks": ["One is", "that science has become too important", "to be left", "to scientists."]}, {"id": "u27s010", "group": 27, "ja_chunks": ["科学の影響は", "私たちの生き方や", "さらには私たちの死に方に及ぼす", "今日,", "大変幅広く感じられているので", "それをゆだねることはできない", "手にだけ", "科学者たちの"], "en_chunks": ["The impact of science", "on the way we live,", "and on the ways in which we may die,", "is now", "so widely felt", "that it cannot be left", "solely in the hands", "of the scientists."]}, {"id": "u27s011", "group": 27, "ja_chunks": ["それは", "私の考えではまったく正しい", "計画は / そして応用は", "科学の", "問題であり", "公の場で議論すべき", "個人的に議論すべき問題ではないということは"], "en_chunks": ["It is", "my view entirely right that the planning", "and the applications", "of science", "should be matters", "of public", "and not of private debate."]}, {"id": "u27s012", "group": 27, "ja_chunks": ["第2の理由は", "テレビである"], "en_chunks": ["The second reason", "is television."]}, {"id": "u27s013", "group": 27, "ja_chunks": ["仕事を持っている科学者は書くことができる", "新聞記事を", "エッセイ", "あるいは本を", "暇な時間に", "だが、作ることはできない", "テレビ番組を", "そのようにして"], "en_chunks": ["A working scientist can write", "a newspaper article,", "an essay", "or a book", "in his spare time,", "but he cannot make", "a television programme", "that way."]}, {"id": "u27s014", "group": 27, "ja_chunks": ["第2点目は", "イギリスでは", "少なくとも", "科学ジャーナリストが", "困難な仕事に立ち向かっている、という点である"], "en_chunks": ["The second point is that,", "in Britain", "at least,", "science journalists", "face an uphill task."]}, {"id": "u27s015", "group": 27, "ja_chunks": ["私たちの文化は今もなお極めて非科学的である。"], "en_chunks": ["Our culture is still deeply unscientific."]}, {"id": "u27s016", "group": 27, "ja_chunks": ["私たちはいまだに", "十分に脱却しているわけではない", "昔からある気取った考え方から", "それによれば働くことは紳士的ではなく", "科学は仕事なのだという"], "en_chunks": ["We have not yet", "fully broken free", "of the old snobbery,", "according to which work is ungentlemanly,", "and science is work."]}, {"id": "u27s017", "group": 27, "ja_chunks": ["明らかに難しいことを考えるならば", "科学ジャーナリストという仕事が", "新しい職業は", "まずまずうまくやっている"], "en_chunks": ["Given the obvious difficulty", "of the job,", "the new profession", "is not doing badly."]}, {"id": "u27s018", "group": 27, "ja_chunks": ["科学番組は", "イギリスの", "思える", "私にははるかに優れているように / 科学番組より", "アメリカの"], "en_chunks": ["The presentation of science on radio and television", "in Britain", "seems to me enormously superior", "to that", "in the United States."]}, {"id": "u27s019", "group": 27, "ja_chunks": ["しかし、欠点もある"], "en_chunks": ["However, there are weaknesses."]}, {"id": "u27s020", "group": 27, "ja_chunks": ["特に", "マスコミは", "欲求が過度に強すぎる", "対立を作りあげようとする", "そして論争を", "マスコミは集中する傾向があるし", "社会的な影響に", "科学の", "科学それ自身というよりも", "そして、", "科学が", "説明されることがもうないので", "科学者の手で", "科学は受け取られている", "非人間的で", "神秘的な体系のように", "ことではなく", "人間がしている"], "en_chunks": ["In particular,", "the media", "show an excessive desire", "to present confrontation", "and controversy;", "they tend to concentrate", "on the social consequences", "of science", "rather than on the science itself;", "and,", "because science is", "no longer presented", "by scientists,", "it appears", "as an impersonal", "and mysterious edifice,", "and not as something", "done by human beings."]}, {"id": "u28s001", "group": 28, "ja_chunks": ["多くの関心を集めている分野は", "近年", "呼ばれている分野である", "人工知能と", "しばしば略称されている", "単に 'AI'と"], "en_chunks": ["An area of much interest", "in recent years", "is that referred to", "as artificial intelligence,", "often shortened", "simply to 'AI'."]}, {"id": "u28s002", "group": 28, "ja_chunks": ["人工知能の目的は", "模倣することである", "機械を使って", "通常は電子機器である", "できるだけ多くの人間の精神活動を", "おそらく、ゆくゆくは", "人間の能力をしのぐことである", "この点で"], "en_chunks": ["The objectives of AI", "are to imitate", "by means of machines,", "normally electronic ones,", "as much of human mental activity as possible,", "and perhaps eventually", "to improve upon human abilities", "in these respects."]}, {"id": "u28s003", "group": 28, "ja_chunks": ["関心が向けられている", "人工知能の成果に対して", "少なくとも4つの方面からの"], "en_chunks": ["There is interest", "in the results of AI", "from at least four directions."]}, {"id": "u28s004", "group": 28, "ja_chunks": ["特に", "研究がある", "ロボット工学の"], "en_chunks": ["In particular", "there is the study", "of robotics."]}, {"id": "u28s005", "group": 28, "ja_chunks": ["ロボット工学は関係している", "産業界からの", "機械装置を求める", "こなすことができる", "「知的な仕事」を", "―すなわちあまりに複雑なので", "以前には必要があった", "人間が介入したり", "管理したりする"], "en_chunks": ["Robotics is concerned with the practical requirements", "of industry", "for mechanical devices", "which can perform", "'intelligent' tasks", "- tasks which are so complicated", "that they have previously demanded", "human intervention", "or control."]}, {"id": "u28s006", "group": 28, "ja_chunks": ["こうした機械装置は期待されている", "こうした仕事をこなすことを", "スピードと", "信頼性で", "いかなる人間の能力をも超える", "あるいは好ましくない条件下で", "人間の生命が", "危険にさらされる可能性がある"], "en_chunks": ["Those mechanical devices are expected", "to perform these tasks", "with a speed", "and reliability", "beyond any human capabilities,", "or under unfavourable conditions", "where human life", "could be at risk."]}, {"id": "u28s007", "group": 28, "ja_chunks": ["また、関心が持たれている", "商業的にも", "一般的にはもちろんだが、開発であり", "エキスパートシステムの", "それにより", "必要不可欠な知識が", "専門的な職業全体の", "医学や法律などといった"], "en_chunks": ["Also of interest", "commercially,", "as well as generally, is the development", "of expert systems,", "according to which", "the essential knowledge", "of an entire profession", "- medical, legal, etc."]}, {"id": "u28s008", "group": 28, "ja_chunks": ["コード化されることが意図されているのだ", "コンピュータープログラムに"], "en_chunks": ["is intended to be coded", "into a computer package!"]}, {"id": "u28s009", "group": 28, "ja_chunks": ["あり得るのだろうか", "経験と技術が", "人間の", "こうした専門的な職業についている", "実際に取って代わられるなどということが", "コンピュータープログラムに"], "en_chunks": ["Is it possible", "that the experience and skill", "of human members", "of these professions", "might actually be replaced", "by such packages?"]}, {"id": "u28s010", "group": 28, "ja_chunks": ["それとも単にこういうことなのだろうか", "事実情報の長いリストだけが", "すべてなのであろうか", "期待されている", "完成させることが"], "en_chunks": ["Or is it merely that", "lists of factual information", "are all", "that can be expected", "to be achieved?"]}, {"id": "u28s011", "group": 28, "ja_chunks": ["問題は", "コンピューターが示すことができるかどうかという", "(あるいは人工的に再現する)", "本物の知能を明らかに", "かなり大きな社会的な影響を及ぼす"], "en_chunks": ["The question", "of whether the computers can exhibit", "(or simulate)", "genuine intelligence clearly", "has considerable social implications."]}, {"id": "u28s012", "group": 28, "ja_chunks": ["もう1つの分野は", "人工知能が持ちうるであろう", "直接の関連を", "心理学である"], "en_chunks": ["Another area", "in which AI could", "have direct relevance", "is psychology."]}, {"id": "u28s013", "group": 28, "j
